<title>大模型求职情报 · 2027届后训练/自进化方向</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--border:#e2e8f0;--ink:#1a202c;--muted:#64748b;--accent:#ff6a00;--accent2:#2563eb;--tag:#eef2ff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-size:14px}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
code{background:#f1f5f9;padding:1px 5px;border-radius:4px;font-size:.92em;font-family:"SF Mono",Menlo,Consolas,monospace}
pre{background:#0f172a;color:#e2e8f0;padding:14px 16px;border-radius:8px;overflow:auto}
pre code{background:none;color:inherit;padding:0}
header{background:linear-gradient(120deg,#1e293b,#0f172a);color:#fff;padding:22px 26px 16px;position:sticky;top:0;z-index:40;box-shadow:0 2px 10px rgba(0,0,0,.12)}
header h1{margin:0 0 4px;font-size:20px;font-weight:700}
header .sub{color:#94a3b8;font-size:13px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-top:12px}
nav button{background:rgba(255,255,255,.08);color:#cbd5e1;border:1px solid rgba(255,255,255,.12);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px;transition:.15s}
nav button:hover{background:rgba(255,255,255,.18)}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
.section{display:none}
.section.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.stat .num{font-size:26px;font-weight:700;color:var(--accent)}
.stat .lbl{color:var(--muted);font-size:12px;margin-top:2px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ctrls input,.ctrls select{padding:7px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:#fff;min-width:140px}
.ctrls input{flex:1;min-width:200px}
.ctrls label{font-size:12px;color:var(--muted)}
.tblwrap{overflow:auto;border:1px solid var(--border);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--border);padding:7px 9px;text-align:left;vertical-align:top}
th{background:#f8fafc;position:sticky;top:0;cursor:pointer;white-space:nowrap;user-select:none}
th .arr{color:var(--muted);font-size:10px}
tr:hover td{background:#f8fafc}
.badge{display:inline-block;min-width:20px;text-align:center;padding:1px 6px;border-radius:10px;font-size:11px;font-weight:700;color:#fff}
.b5{background:#dc2626}.b4{background:#ea580c}.b3{background:#64748b}.b2{background:#94a3b8}.b1{background:#cbd5e1;color:#475569}
.ltag{display:inline-block;padding:1px 7px;border-radius:5px;background:var(--tag);color:var(--accent2);font-size:11px;margin-right:3px}
.joblink{word-break:break-all}
.doc-select{min-width:320px}
.markdown h1{font-size:20px;border-bottom:2px solid var(--border);padding-bottom:6px;margin-top:8px}
.markdown h2{font-size:17px;margin-top:18px;border-bottom:1px solid var(--border);padding-bottom:4px}
.markdown h3{font-size:15px;margin-top:14px;color:#334155}
.markdown ul,.markdown ol{padding-left:22px}
.markdown li{margin:3px 0}
.markdown blockquote{border-left:3px solid var(--accent);color:var(--muted);padding:2px 12px;margin:8px 0;background:#fffaf5}
.markdown table th{background:#f1f5f9}
.markdown hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.muted{color:var(--muted)}
.pill{font-size:11px;padding:2px 8px;border-radius:12px;background:#eef2ff;color:#3730a3;margin-left:6px}
.hint{font-size:12px;color:var(--muted);margin:6px 0 2px}
.detail-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.btn{background:var(--accent2);color:#fff;border:none;padding:7px 12px;border-radius:7px;cursor:pointer;font-size:13px}
.btn.ghost{background:#fff;color:var(--accent2);border:1px solid var(--accent2)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
@media(max-width:640px){header{position:static} th,td{white-space:nowrap}}
.nav-ext{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.nav-ext span{color:#94a3b8;font-size:12px}
.nav-ext a.nx{background:rgba(255,106,0,.18);color:#ffd9b3;border:1px solid rgba(255,106,0,.45);padding:5px 13px;border-radius:20px;font-size:12.5px;transition:.15s}
.nav-ext a.nx:hover{background:#ff6a00;color:#fff;text-decoration:none}
</style>

<script id="leeseLoader">
(function(){
  var el=document.getElementById('appdata');
  var b64=el.textContent.trim();
  function setErr(s){var e=document.getElementById('leeseErr');if(e)e.textContent=s;}
  async function unlock(pwd){
    setErr('解密中...');
    try{
      var raw=Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0)});
      var salt=raw.slice(0,16), iv=raw.slice(16,28), data=raw.slice(28);
      var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),{name:'PBKDF2'},false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data);
      var ds=new DecompressionStream('gzip');
      var text=await new Response(new Blob([pt]).stream().pipeThrough(ds)).text();
      el.textContent=text;
      sessionStorage.setItem('leesePwd',pwd);
      var lk=document.getElementById('leeseLock'); if(lk)lk.remove();
      document.dispatchEvent(new Event('leeseReady'));
    }catch(e){setErr('密码错误,请重试');}
  }
  window.__leeseUnlock=unlock;
  document.getElementById('leeseBtn').onclick=function(){unlock(document.getElementById('leesePwd').value)};
  var pe=document.getElementById('leesePwd');
  pe.addEventListener('keydown',function(e){if(e.key==='Enter')unlock(pe.value)});
  var saved=sessionStorage.getItem('leesePwd');
  if(saved){pe.value=saved;unlock(saved);}
})();
</script><script>document.addEventListener("leeseReady",function(){

const DATA = JSON.parse(document.getElementById('appdata').textContent);
const jobs = DATA.jobs, companies = DATA.companies, docs = DATA.docs, stand = DATA.standalone;

/* ---------- markdown renderer ---------- */
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function mdToHtml(md){
  const lines=(md||'').split(/\r?\n/);
  let out=[], i=0, n=lines.length, para=[];
  function flush(){if(para.length){out.push('<p>'+inline(para.join(' '))+'</p>');para=[];}}
  while(i<n){
    let line=lines[i];
    if(/^```/.test(line)){flush();let c=[];i++;while(i<n&&!/^```/.test(lines[i])){c.push(lines[i]);i++;}i++;out.push('<pre><code>'+esc(c.join('\n'))+'</code></pre>');continue;}
    if(/^\s*\|/.test(line) && i+1<n && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      flush();
      let h=line.trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim());
      i+=2;let rows=[];
      while(i<n&&/^\s*\|/.test(lines[i])){rows.push(lines[i].trim().replace(/^\||\|$/g,'').split('|').map(s=>s.trim()));i++;}
      let t='<div class="tblwrap"><table><thead><tr>'+h.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';
      t+=rows.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('');
      t+='</tbody></table></div>';out.push(t);continue;
    }
    let h=line.match(/^(#{1,6})\s+(.*)$/);
    if(h){flush();out.push('<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>');i++;continue;}
    if(/^\s*---+\s*$/.test(line)){flush();out.push('<hr>');i++;continue;}
    if(/^\s*>\s?/.test(line)){flush();out.push('<blockquote>'+inline(line.replace(/^\s*>\s?/,''))+'</blockquote>');i++;continue;}
    if(/^\s*[-*]\s+/.test(line)){flush();let it=[];while(i<n&&/^\s*[-*]\s+/.test(lines[i])){it.push('<li>'+inline(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>');i++;}out.push('<ul>'+it.join('')+'</ul>');continue;}
    if(/^\s*\d+\.\s+/.test(line)){flush();let it=[];while(i<n&&/^\s*\d+\.\s+/.test(lines[i])){it.push('<li>'+inline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>');i++;}out.push('<ol>'+it.join('')+'</ol>');continue;}
    if(/^\s*$/.test(line)){flush();i++;continue;}
    para.push(line);i++;
  }
  flush();return out.join('\n');
}
function badge(m){m=parseInt(m)||0;return '<span class="badge b'+m+'">'+m+'</span>';}
function layerTag(l){return '<span class="ltag">'+l+'</span>';}

/* ---------- nav ---------- */
document.querySelectorAll('#nav button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById(b.dataset.tab).classList.add('active');
  };
});
function goTab(t){document.querySelector('#nav button[data-tab="'+t+'"]').click();}

/* ---------- overview ---------- */
function renderOverview(){
  const byLayer={}, byMatch={};
  companies.forEach(c=>{byLayer[c.layer]=(byLayer[c.layer]||0)+1;byMatch[c.match]=(byMatch[c.match]||0)+1;});
  const hm=jobs.filter(j=>parseInt(j['匹配度(1-5)'])>=4).length;
  const l3=byLayer['L3']||0;
  let topPicks=companies.filter(c=>parseInt(c.match)===5).slice(0,8);
  let html='<div class="stats">'+
    stat(DATA.meta.n_companies,'覆盖公司/机构')+
    stat(DATA.meta.n_jobs,'岗位条目')+
    stat(hm,'匹配度≥4 岗位')+
    stat(l3,'L3 后训练/RL/数据/评测')+
    stat(topPicks.length+'+'+ (companies.filter(c=>parseInt(c.match)===5).length),'匹配度5 公司')+
    stat('30','Top30 优先投递')+
    '</div>';
  html+='<div class="card"><h3 style="margin:0 0 8px">层级分布</h3>';
  Object.keys(byLayer).sort().forEach(l=>{html+='<span class="ltag">'+l+': '+byLayer[l]+'</span> ';});
  html+='</div>';
  html+='<div class="card"><h3 style="margin:0 0 8px">匹配度分布</h3>';
  [5,4,3,2,1].forEach(m=>{if(byMatch[m])html+=badge(m)+' '+byMatch[m]+' 家 &nbsp; ';});

  html+='<div class="card"><h3 style="margin:2px 0 10px">匹配度5 · 速览（建议优先投递）</h3><div class="tblwrap"><table><thead><tr><th>公司</th><th>层级</th><th>城市</th><th>代表模型</th><th>一句话匹配点</th><th>档案</th></tr></thead><tbody>';
  topPicks.forEach(c=>{
    html+='<tr><td><strong>'+esc(c.company)+'</strong></td><td>'+layerTag(c.layer)+'</td><td>'+esc(c.city)+'</td><td>'+esc(c.model)+'</td><td>'+esc(c.point)+'</td><td>'+(c.file?'<a href="javascript:goDetail(\''+esc(c.file)+'\')">查看</a>':'')+'</td></tr>';
  });
  html+='</tbody></table></div></div>';
  html+='<div class="card muted">提示：点击顶部标签切换「公司总表/岗位明细/Top30推荐/投递日历/公司档案」。岗位与公司均可搜索、筛选、排序。投递日历含特殊人才计划汇总与 2027 届时间线。</div>';
  document.getElementById('overview').innerHTML=html;
}
function stat(n,l){return '<div class="stat"><div class="num">'+n+'</div><div class="lbl">'+l+'</div></div>';}

/* ---------- companies table ---------- */
let cSort={key:'match',dir:-1}, cFilter={q:'',layer:'',match:''};
function renderCompanies(){
  let html='<div class="ctrls">'+
    '<input id="cq" placeholder="搜索公司/模型/团队/匹配点…" >'+
    '<select id="cl"><option value="">全部层级</option>'+['L1','L2','L3','L4','L5','L6'].map(l=>'<option value="'+l+'">'+l+'</option>').join('')+'</select>'+
    '<select id="cm"><option value="">全部匹配度</option>'+[5,4,3,2,1].map(m=>'<option value="'+m+'">'+m+'</option>').join('')+'</select>'+
    '<span class="hint" id="ccount"></span></div>';
  html+='<div class="tblwrap"><table id="ctable"><thead><tr>'+
    ['<th data-k="num">#</th>','<th data-k="company">公司</th>','<th data-k="layer">层级</th>','<th data-k="city">城市</th>','<th data-k="base">基座自研</th>','<th data-k="rl">后训练/RL</th>','<th data-k="model">代表模型</th>','<th data-k="team">团队</th>','<th data-k="jobcount">在招岗</th>','<th data-k="match">匹配度</th>','<th data-k="point">一句话匹配点</th>','<th>档案</th>'].join('')+
    '</tr></thead><tbody id="ctbody"></tbody></table></div>';
  document.getElementById('companies').innerHTML=html;
  document.getElementById('cq').oninput=applyCompanies;
  document.getElementById('cl').onchange=applyCompanies;
  document.getElementById('cm').onchange=applyCompanies;
  document.querySelectorAll('#ctable th[data-k]').forEach(th=>{th.onclick=()=>{if(cSort.key===th.dataset.k)cSort.dir*=-1;else{cSort.key=th.dataset.k;cSort.dir=-1;}applyCompanies();};});
  applyCompanies();
}
function applyCompanies(){
  let q=(document.getElementById('cq').value||'').toLowerCase();
  let layer=document.getElementById('cl').value, match=document.getElementById('cm').value;
  let rows=companies.filter(c=>{
    if(layer&&c.layer!==layer)return false;
    if(match&&c.match!==match)return false;
    if(q){let s=(c.company+c.model+c.team+c.point+c.city).toLowerCase();if(s.indexOf(q)<0)return false;}
    return true;
  });
  let k=cSort.key, dir=cSort.dir;
  rows.sort((a,b)=>{
    let x=a[k],y=b[k];
    if(k==='match'||k==='num'||k==='jobcount'){x=parseInt(x)||0;y=parseInt(y)||0;}
    return dir*(x>y?1:(x<y?-1:0));
  });
  let tb=document.getElementById('ctbody');let h='';
  rows.forEach(c=>{
    h+='<tr><td>'+c.num+'</td><td><strong>'+esc(c.company)+'</strong></td><td>'+layerTag(c.layer)+'</td><td>'+esc(c.city)+'</td><td>'+esc(c.base)+'</td><td>'+esc(c.rl)+'</td><td>'+esc(c.model)+'</td><td>'+esc(c.team)+'</td><td>'+esc(c.jobcount)+'</td><td>'+badge(c.match)+'</td><td>'+esc(c.point)+'</td><td>'+(c.file?'<a href="javascript:goDetail(\''+esc(c.file)+'\')">查看</a>':'')+'</td></tr>';
  });
  if(!rows.length)h='<tr><td colspan="12" class="muted" style="padding:14px">无匹配</td></tr>';
  tb.innerHTML=h;
  document.getElementById('ccount').textContent='共 '+rows.length+' 家';
}

/* ---------- jobs table ---------- */
let jSort={key:'match',dir:-1};
function renderJobs(){
  let layers=[...new Set(jobs.map(j=>j['方向标签']))].filter(Boolean).sort();
  let types=[...new Set(jobs.map(j=>j['岗位类型(校招/实习/社招)']))].filter(Boolean).sort();
  let html='<div class="ctrls">'+
    '<input id="jq" placeholder="搜索公司/岗位/城市/核心要求…">'+
    '<select id="jt"><option value="">全部类型</option>'+types.map(t=>'<option value="'+esc(t)+'">'+esc(t)+'</option>').join('')+'</select>'+
    '<select id="jm"><option value="">全部匹配</option>'+[5,4,3,2,1].map(m=>'<option value="'+m+'">'+m+'</option>').join('')+'</select>'+
    '<label><input type="checkbox" id="jhm"> 仅≥4</label>'+
    '<span class="hint" id="jcount"></span></div>';
  html+='<div class="tblwrap"><table id="jtable"><thead><tr>'+
    ['<th data-k="公司">公司</th>','<th data-k="团队/BU">团队/BU</th>','<th data-k="岗位名称">岗位名称</th>','<th data-k="岗位类型(校招/实习/社招)">类型</th>','<th data-k="城市">城市</th>','<th data-k="方向标签">方向</th>','<th data-k="核心要求">核心要求</th>','<th data-k="是否要求RL/后训练经验">要RL?</th>','<th data-k="投递链接">投递链接</th>','<th data-k="截止时间">截止</th>','<th data-k="匹配度(1-5)">匹配</th>'].join('')+
    '</tr></thead><tbody id="jtbody"></tbody></table></div>';
  document.getElementById('jobs').innerHTML=html;
  ['jq','jt','jm','jhm'].forEach(id=>{let el=document.getElementById(id);el.oninput=applyJobs;el.onchange=applyJobs;});
  document.querySelectorAll('#jtable th[data-k]').forEach(th=>{th.onclick=()=>{if(jSort.key===th.dataset.k)jSort.dir*=-1;else{jSort.key=th.dataset.k;jSort.dir=-1;}applyJobs();};});
  applyJobs();
}
function applyJobs(){
  let q=(document.getElementById('jq').value||'').toLowerCase();
  let t=document.getElementById('jt').value, m=document.getElementById('jm').value, hm=document.getElementById('jhm').checked;
  let rows=jobs.filter(j=>{
    if(t&&j['岗位类型(校招/实习/社招)']!==t)return false;
    if(m&&j['匹配度(1-5)']!==m)return false;
    if(hm&&parseInt(j['匹配度(1-5)'])<4)return false;
    if(q){let s=(j['公司']+j['岗位名称']+j['城市']+j['核心要求']+j['方向标签']).toLowerCase();if(s.indexOf(q)<0)return false;}
    return true;
  });
  let k=jSort.key, dir=jSort.dir;
  rows.sort((a,b)=>{let x=a[k]||'',y=b[k]||'';if(k==='匹配度(1-5)'){x=parseInt(x)||0;y=parseInt(y)||0;}return dir*(x>y?1:(x<y?-1:0));});
  let tb=document.getElementById('jtbody');let h='';
  rows.forEach(j=>{
    let link=j['投递链接'];let lk=link?('<a class="joblink" href="'+esc(link)+'" target="_blank" rel="noopener">'+esc(link.replace(/^https?:\/\//,'').slice(0,40))+(link.length>43?'…':'')+'</a>'):'';
    h+='<tr><td><strong>'+esc(j['公司'])+'</strong></td><td>'+esc(j['团队/BU'])+'</td><td>'+esc(j['岗位名称'])+'</td><td>'+esc(j['岗位类型(校招/实习/社招)'])+'</td><td>'+esc(j['城市'])+'</td><td>'+esc(j['方向标签'])+'</td><td>'+esc(j['核心要求'])+'</td><td>'+esc(j['是否要求RL/后训练经验'])+'</td><td>'+lk+'</td><td>'+esc(j['截止时间'])+'</td><td>'+badge(j['匹配度(1-5)'])+'</td></tr>';
  });
  if(!rows.length)h='<tr><td colspan="11" class="muted" style="padding:14px">无匹配</td></tr>';
  tb.innerHTML=h;
  document.getElementById('jcount').textContent='共 '+rows.length+' 条';
}

function renderDetail(){
  let html='<div class="card"><div class="detail-head"><strong>选择公司档案：</strong><select id="docsel" class="doc-select"><option value="">— 选择 —</option>'+docs.map(d=>'<option value="'+esc(d.file)+'">'+esc(d.h1)+'</option>').join('')+'</select><input id="docq" placeholder="按公司名快速过滤…" style="flex:1;min-width:200px"></div><div id="docbody" class="muted">在上方选择或搜索一家公司，查看其完整情报档案（基座/后训练证据、在招岗位、特殊人才计划、投递入口、时间节点、内推、匹配分析）。</div></div>';
  document.getElementById('detail').innerHTML=html;
  document.getElementById('docsel').onchange=showDoc;
  document.getElementById('docq').oninput=filterDocs;
  filterDocs();
}
function filterDocs(){
  let q=(document.getElementById('docq').value||'').toLowerCase();
  let sel=document.getElementById('docsel');
  let opts='<option value="">— 选择 —</option>'+docs.filter(d=>(d.h1.toLowerCase().indexOf(q)>=0||d.file.toLowerCase().indexOf(q)>=0)).map(d=>'<option value="'+esc(d.file)+'">'+esc(d.h1)+'</option>').join('');
  sel.innerHTML=opts;
}
function showDoc(){
  let f=document.getElementById('docsel').value;
  if(!f){document.getElementById('docbody').className='muted';document.getElementById('docbody').textContent='在上方选择或搜索一家公司。';return;}
  let d=docs.find(x=>x.file===f);
  document.getElementById('docbody').className='markdown';
  document.getElementById('docbody').innerHTML=mdToHtml(d.content);
}
function goDetail(file){goTab('detail');document.getElementById('docsel').value=file;showDoc();}
