<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小红书·大模型面经/经验帖汇总</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--card2:#21252e;--tx:#e8eaed;--mut:#9aa0a6;--acc:#ff4757;--acc2:#ffa502;--ok:#2ed573;--bd:#2d3139}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.hd{padding:28px 20px 16px;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,#16191f,transparent)}
.hd h1{margin:0 0 6px;font-size:22px}
.hd .sub{color:var(--mut);font-size:13px}
.stat{margin:14px 0 4px;display:flex;flex-wrap:wrap;gap:8px}
.stat b{color:var(--ok)}
.ctrl{padding:14px 20px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:9}
.ctrl input,.ctrl select{background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:14px;margin:4px 4px 0 0}
.ctrl input{width:240px;max-width:55%}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.lbl{color:var(--mut);font-size:12px;margin-right:2px}
.toggle{cursor:pointer;background:var(--card2);border:1px solid var(--bd);color:var(--mut);border-radius:14px;padding:5px 12px;font-size:13px}
.toggle.on{background:var(--acc2);color:#000;border-color:var(--acc2)}
#list{padding:14px 20px 60px;max-width:980px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.card.fit{border-left:3px solid var(--acc)}
.cmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.co{font-weight:700;color:var(--acc2)}
.tag{background:var(--card2);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;font-size:12px;color:#cfd3da}
.tag.rl{color:var(--ok);border-color:#2a5a3a}
.tag.stage{color:#ffd60a;border-color:#5a4a2a;background:#2a2418}
.tag.city{color:#7d8aff;border-color:#2a3a6a}
.star{color:var(--acc);font-weight:700}
.title{font-size:16px;font-weight:600;margin:2px 0 8px;line-height:1.45}
.title a{color:var(--tx);text-decoration:none}
.title a:hover{color:var(--acc2)}
.desc{color:#c0c4ca;font-size:13.5px;white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:hidden}
.desc.open{max-height:none}
.more{color:var(--acc2);cursor:pointer;font-size:13px;margin-top:4px;display:inline-block}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:30px 20px;border-top:1px solid var(--bd)}
.pill{display:inline-block;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:3px 10px;margin:2px;font-size:12px;color:#c0c4ca}
@media(max-width:640px){.ctrl input{width:100%}.hd{padding:18px 14px}}
</style>
</head>

<style>
#leeseLock{position:fixed;inset:0;background:#0f1115;color:#e8eaed;display:flex;align-items:center;justify-content:center;z-index:2147483647;font-family:-apple-system,"PingFang SC",sans-serif}
.leeseBox{background:#1a1d24;border:1px solid #2d3139;border-radius:14px;padding:30px 26px;width:300px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.leeseBox h2{margin:0 0 6px;color:#ffa502;font-size:18px}
.leeseBox p{color:#9aa0a6;font-size:12.5px;margin:0 0 18px;line-height:1.5}
.leeseBox input{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:9px;background:#21252e;border:1px solid #2d3139;color:#e8eaed;font-size:14px;outline:none}
.leeseBox input:focus{border-color:#ffa502}
.leeseBox button{margin-top:12px;width:100%;padding:11px;border-radius:9px;border:0;background:#ffa502;color:#000;font-size:14px;font-weight:600;cursor:pointer}
.leeseBox button:hover{background:#ffb940}
#leeseErr{color:#ff4757;font-size:12px;margin-top:10px;min-height:16px}
.leeseHint{color:#5a5f66;font-size:11px;margin-top:16px}
</style>
<div id="leeseLock"><div class="leeseBox">
<h2>🔒 访问受限</h2>
<p>本页内容已加密,请输入访问密码解锁。</p>
<input id="leesePwd" type="password" placeholder="访问密码" autocomplete="off" autofocus>
<button id="leeseBtn">解锁</button>
<div id="leeseErr"></div>
<div class="leeseHint">tianyuhang04 求职研究页 · 忘记密码请联系站长</div>
</div></div>
<script id="leeseLoader">
(function(){
  var el=document.getElementById('leesedata');
  var b64=el.textContent.trim();
  function setErr(s){var e=document.getElementById('leeseErr');if(e)e.textContent=s;}
  async function unlock(pwd){
    setErr('解密中...');
    try{
      var raw=Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0)});
      var salt=raw.slice(0,16), iv=raw.slice(16,28), data=raw.slice(28);
      var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pwd),{name:'PBKDF2'},false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data);
      var ds=new DecompressionStream('gzip');
      var text=await new Response(new Blob([pt]).stream().pipeThrough(ds)).text();
      el.textContent=text;
      sessionStorage.setItem('leesePwd',pwd);
      var lk=document.getElementById('leeseLock'); if(lk)lk.remove();
      document.dispatchEvent(new Event('leeseReady'));
    }catch(e){setErr('密码错误,请重试');}
  }
  window.__leeseUnlock=unlock;
  document.getElementById('leeseBtn').onclick=function(){unlock(document.getElementById('leesePwd').value)};
  var pe=document.getElementById('leesePwd');
  pe.addEventListener('keydown',function(e){if(e.key==='Enter')unlock(pe.value)});
  var saved=sessionStorage.getItem('leesePwd');
  if(saved){pe.value=saved;unlock(saved);}
})();
</script><script>document.addEventListener("leeseReady",function(){

var D=JSON.parse(document.getElementById('leesedata').textContent);
var I=D.items, M=D.meta;
document.getElementById('n').textContent=M.total;
document.getElementById('dt').textContent=M.scrape_date;
var dirsSet={},citySet={},coSet={},stSet={};
I.forEach(x=>{x.dirs.forEach(d=>dirsSet[d]=1);x.stages.forEach(s=>stSet[s]=1);citySet[x.city]=1;coSet[x.company]=1});
function fill(sel,obj){Object.keys(obj).sort().forEach(k=>{var o=document.createElement('option');o.value=k;o.textContent=k;sel.appendChild(o)})}
fill(document.getElementById('fd'),dirsSet);
fill(document.getElementById('fc'),coSet);
fill(document.getElementById('fs'),stSet);
fill(document.getElementById('fcity'),citySet);
var stHtml='<span>总计 <b>'+M.total+'</b> 帖</span> <span>★命中方向 <b>'+M.fit+'</b></span>';
Object.keys(M.companies).slice(0,10).forEach(c=>{stHtml+='<span class="pill">'+c+' '+M.companies[c]+'</span>'});
document.getElementById('stat').innerHTML=stHtml;
var fitOnly=false;
var fitBtn=document.getElementById('fitbtn');
fitBtn.onclick=()=>{fitOnly=!fitOnly;fitBtn.classList.toggle('on');render()};
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){
 var q=document.getElementById('q').value.trim().toLowerCase();
 var fd=document.getElementById('fd').value;
 var fc=document.getElementById('fc').value;
 var fs=document.getElementById('fs').value;
 var fcity=document.getElementById('fcity').value;
 var out=[];
 I.forEach(x=>{
   if(fitOnly&&!x.fit)return;
   if(fd&&x.dirs.indexOf(fd)<0)return;
   if(fc&&x.company!=fc)return;
   if(fs&&x.stages.indexOf(fs)<0)return;
   if(fcity&&x.city!=fcity)return;
   if(q){var blob=(x.title+' '+x.company+' '+x.dirs.join(' ')+' '+x.stages.join(' ')+' '+x.desc).toLowerCase();if(blob.indexOf(q)<0)return}
   out.push(x);
 });
 var el=document.getElementById('list');
 if(!out.length){el.innerHTML='<div style="color:var(--mut);text-align:center;padding:40px">无匹配帖</div>';return}
 el.innerHTML=out.map(x=>{
   var tagHtml=x.dirs.map(d=>'<span class="tag '+(d.indexOf('RL')>=0||d=='后训练'?'rl':'')+'">'+d+'</span>').join('')
     +x.stages.map(s=>'<span class="tag stage">'+s+'</span>').join('')
     +'<span class="tag city">'+esc(x.city)+'</span>';
   var star=x.fit?'<span class="star">★</span> ':'';
   var more='';
   if(x.desc.length>180)more=' <span class="more">展开▾</span>';
   return '<div class="card '+(x.fit?'fit':'')+'">'
    +'<div class="cmeta"><span class="co">'+esc(x.company)+'</span>'+tagHtml+'</div>'
    +'<div class="title">'+star+'<a href="'+x.url+'" target="_blank" rel="noopener">'+esc(x.title)+'</a></div>'
    +'<div class="desc">'+esc(x.desc)+'</div>'+more
    +'<div class="apply" style="margin-top:8px;font-size:13px;color:var(--mut)">🙋 '+esc(x.author)+' · '+esc(x.date)+' · 关键词: '+esc(x.kw)+'</div>'
    +'</div>';
 }).join('');
 el.querySelectorAll('.more').forEach((m)=>{
   m.onclick=()=>{var c=m.previousElementSibling;c.classList.toggle('open');m.textContent=c.classList.contains('open')?'收起▴':'展开▾'}
 });
}
document.getElementById('q').oninput=render;
document.getElementById('fd').onchange=render;
document.getElementById('fc').onchange=render;
document.getElementById('fs').onchange=render;
document.getElementById('fcity').onchange=render;
render();

});</script>
