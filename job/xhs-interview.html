8","company":"其他/未注明","dirs":["后训练","RL强化学习","数据/评测","NLP/通用"],"stages":[],"city":"未注明","fit":true,"desc":"面壁智能\n大模型后训练（蒸馏方向）\n自己在准备面试的时候感谢各位友友的分享\n1.自我介绍\n2.数据如何清洗构造合成\n3.ppo原理，单轮和多轮损失的分别如何计算，单次采样更新，还是多次更新\n4.微调方法有哪些，为什么选用Lora不用全量或者其他，面试官最后问懂不懂RFT（应该是拒绝采样微调）\n5.训练使用框架，trl，peft 等等，还有verl\n6.介绍Grpo原理，采样一次做几次正向传播，损失是怎么计算的\n7.重要性采样比率如何获得，新旧策略概率只用一次吗（问的应该是经验池），如果通过黑盒方法得到了训练中的优势值，他是如何与重要性采样比率作用的，（我的理解他应该问的就是损失函数和clip机制）\n8.奖励模型的改进思路有哪些\n9.能不能去掉显式的奖励模型，用其他的方法来代替\n10.经典问题为什么用ppo不用Grpo，感觉每个面试官都会问\n11.在线强化学习定义\n12.rl训练过程中会监控哪些指标，效果评估怎么衡量幻觉率，如果出现了奖励做弊要怎么解决\n手撕\n用torch写一个batch的平均熵如何实现，我用了F.softmax的算子，面试官让我改成用torch.logsumexp 算子实现\n一共一个多小时，面试官比较专业，不会地方面试官会引导。\n#人工智能就业 #大模型#面试#面经 #ai #人工智能#学习 #刷题 #力扣 #科技前沿与未来","url":"https://www.xiaohongshu.com/explore/69ad19f30000000015038501","kw":"大模型面经"},{"title":"LLM&Agent算法面经之八股总结（全）","author":"算法小登sfxd","date":"05-26","company":"大厂泛","dirs":["Agent/自进化","NLP/通用"],"stages":[],"city":"未注明","fit":true,"desc":"Bg：双非本+华五硕，天坑专业，2段大模型算法实习（业务+科研），之前发过零散的八股总结，现在合并起来发@职场薯\n\t\n小登的校招即将落幕，本篇是所有我遇到过八股的总结，已经分类放好了，具体见图，希望能够帮助到大家\n\t\n#求职 #算法 #面经 #面试题 #校招 #秋招 #大模型  #互联网大厂 #职场有路子#春招","url":"https://www.xiaohongshu.com/explore/6a159aa80000000035027199","kw":"Agent面经"},{"title":"大模型算法女工跳槽记录","author":"菠萝芝士堡","date":"编辑于 01-12","company":"大厂泛","dirs":["后训练","RL强化学习","数据/评测","NLP/通用","C++/工程"],"stages":[],"city":"未注明","fit":true,"desc":"作为一名普通算法女工，没多少大模型经历，这次社招真的脱了一层皮。现在LLM行情虽然火，但要求真的越来越离谱了。。。\n简单复盘下这次跳槽的心路历程和准备干货，希望能帮到还在坑里的大家！\n\t\n基础八股\n现在只会transformer、attention已经跟不上时代了，基础八股还需补充：\nRoPE原理\nFlash Attention、KV Cache原理\nZERO-1/2/3到底省了哪部分显存？\nLoRA为什么有效？\nDPO、PPO原理\nGRPO、DAPO、GSPO都做了哪些改进\n\t\n项目深挖\n只做过数据的同学其实也有机会试试大模型岗，数据的合成、清洗、质检等等都可以看看现在的论文，工业界也基本都大差不差；\n训练方面容易遇到的问题问得最多的就是熵崩溃、熵爆炸、reward hacking这种；\n如果没接触过大模型训练，可以先从开源框架跑起，熟悉一下，有个感觉就行；\n\t\n手撕代码\n力扣hot100够用，绝大部分公司出的就是编辑距离、树的层序遍历、左右视图、动态规划这些高频题；\n非力扣手撕需要掌握MHA、RMSNorm、RoPE等，我的另一篇笔记里有详细的整理；\n\t\n其他建议\n心态要稳，被挂很正常，有时候不是你不行，是HC锁了或者方向不match；\n不要怕做的东西不行，搞清楚吃透项目细节，有条理的讲出来；\n遇到场景题不要慌，一般场景题会基于你做的东西去提问，试着讲清楚你的思考逻辑；\n\t\n这一行虽然卷，但现在机会还是很多的！\n祝大家都能拿到满意的包！\n\t\n#大模型 #算法 #算法工程师 #社招 #面试 #互联网大厂 #跳槽 #LLM #人工智能 #随便写点什么","url":"https://www.xiaohongshu.com/explore/6963b3e5000000002103c033","kw":"算法八股"},{"title":"最近的大模型面经总结","author":"粽子","date":"编辑于 03-09","company":"大厂泛","dirs":["后训练","RL强化学习","对齐","AI Infra","NLP/通用","C++/工程","ML基础"],"stages":[],"city":"未注明","fit":true,"desc":"整理了一下最近面试遇到的八股，一般都是聊项目串着聊八股。\nRL：\n1. GSPO和GRPO的区别，GSPO和GRPO的gap怎么理解，实际训练的时候为什么GSPO效果比GRPO更优，这俩显存占用怎么样？\n2. PPO GRPO DPO的区别，实际工程里PPO GRPO DPO分别适合什么场景？各有什么问题\n3. GRPO和PPO是on-policy还是off-policy\n4. KL估计器K1 K2 K3\n5. 正向KL和反向 KL在大模型RL里有什么不同？为什么对齐几乎都用反向KL？\n6. GRPO为什么不需要单独训练奖励模型RM？它的奖励从哪来，如何调整GRPO的超参达到想要的效果？\n7. PPO的clip解决什么问题？不clip会怎样？\n8. 实际训练中，KL系数β太大 / 太小分别会出现什么现象\n9. PPO的loss包含哪些？如何考虑loss weight\n10. 介绍一下GAE，为什么λ经常设置成0.95？\n\t\nDL：\n1. 梯度累计\n2. softmax的处理、safe softmax\n3. Adam优化器\n4. softmax 数值上溢 / 下溢原因，为什么attention要除以根号dk\n5.梯度消失、梯度爆炸的原因与解决方案\n\t\ninfra:\n1. flash attention的原理，最近新出的flash attention有了解过吗\n2. verl中的hybridengine、auto mapping原理，最大的创新点是什么？\n3. DP PP TP的原理和使用场景，各个阶段怎么调整？\n4. FSDP、ZeRO1、2、3\n5. 能不能讲一下混合精度计算？什么阶段采用什么？\n\t\ncoding：\n1. MHA、GQA\n2. hot100原题\n3. 交叉熵损失\n4. softmax\n面的多还是有好处的，感觉每场面试都能知道自己有哪方面不足还可以往哪继续改进\n#大模型 #面经 #大厂 #算法 #深度学习 #互联网大厂","url":"https://www.xiaohongshu.com/explore/69ae814d000000001d027463","kw":"大模型面经"},{"title":"近期训练营同学面试题总结","author":"DailyLLM","date":"05-05","company":"大厂泛","dirs":["后训练","RL强化学习","Agent/自进化","多模态","AI Infra","搜推","C++/工程"],"stages":[],"city":"未注明","fit":true,"desc":"最近在给训练营的同学做面试复盘，感觉其实高频考点就是几类：RL 后训练、Agent 工程化、RAG 深水区、推理与系统底层。\n\t\n#大模型 #多模态人工智能 #面试题 #大模型 #面试日常 #互联网大厂 #大模型面试","url":"https://www.xiaohongshu.com/explore/69f9c3bb000000003502d4b0","kw":"面试总结"},{"title":"面试官问RL算法，我靠这份文档拿下offer！","author":"吉米爱学习","date":"编辑于 2025-12-08","company":"大厂泛","dirs":["后训练","RL强化学习","对齐","数据/评测","C++/工程"],"stages":[],"city":"未注明","fit":true,"desc":"强化学习作为秋招面试高频热点，属实是被问烂了要，今天整理了一下DPO PPO GRPO GSPO相关原理和对比。\n\t\n👉 PPO：经典中的经典，但调参也让人头大…\n👉 DPO：绕开PPO的复杂流程，直接用偏好数据优化，简直是“捷径”！\n👉 GRPO：PPO的简化版？还是升级版？优势在哪？\n👉 GSPO：这个可能比较新，但思想很巧妙，必须了解一下！\n✅ 每个算法的核心原理一句话讲清楚\n✅ 优缺点对比，让你面试时能侃侃而谈\n✅ 适用场景分析，体现你的工程思维\n\t\n希望能帮到正在求职的你，祝大家都能拿到心仪的offer！🎉\n\t\n#人工智能 #强化学习 #算法 #面试 #求职 #PPO #DPO #GRPO #GSPO  #互联网大厂","url":"https://www.xiaohongshu.com/explore/6933d3c9000000001e033078","kw":"强化学习面经"},{"title":"面试讲项目其实也是一种“渐进式披露”","author":"谷谷谷雨（秋招版","date":"编辑于 08-06 浙江","company":"大厂泛","dirs":["对齐","数据/评测"],"stages":[],"city":"未注明","fit":true,"desc":"最近准备面试的时候突然感到：\n\t\n讲项目要像写 skill 一样，也是要渐进式披露：先像描述这棵树的主干一样，然后在每一个可能长出枝干的地方，埋下关键词和钩子。所以回应“简单介绍一下你 xx 项目“这种问题，顶多一分半钟就好了，后面的就等待面试官的追问。\n\t\n因为如果一开场就把背景、数据、方案、协作、难点、结果全部倒出来，很给面试官的感受可能是信息太多太长，抓不住重点，容易跑神。尤其是项目稍微复杂一点的时候，会本能地想把因果链讲完整，每一个点展开都能讲很久。\n\t\n所以初次介绍项目的目的是让对方在一分钟左右大概听懂 “这个项目到底在解决什么问题，我在里面做了什么判断，结果证明了什么”。\n\t\n01｜总结了一个项目介绍结构：\n\t\n先对齐业务场景：这个项目发生在哪条业务链路里，核心指标是什么\n\t\n说清问题：当时哪个指标变差了，说明业务哪里出了问题\n\t\n给出定位：我怎么从现象下钻到根因\n\t\n关键动作：我具体负责哪几件事，和团队怎么协作\n\t\n结果：哪个指标改善了，项目推进到什么状态\n\t\n讲完就可以停了，先给一张项目地图，对方对哪一块感兴趣，就顺着那个节点往下问，所以我觉得“渐进式披露”这个词特别适合面试\n\t\n02｜那剩下的项目细节怎么准备呢\n\t\n我的做法是先做一张项目主卡，再拆几个追问小卡片。主卡只回答“介绍一下这个项目”。小卡片负责存放问题定位、数据分析、实验动作、协作边界、ownership 和复盘。\n\t\n每张小卡片都按 STAR 讲清楚：当时什么场景，遇到什么问题，我做了什么，带来什么结果。具体按照这个层次来拆解：\n\t\n第一层是主干：\n业务背景、问题、动作、结果。这些用于初次介绍项目\n\t\n第二层是追问：\n数据怎么来的、方案为什么这样选、实验怎么设计、协作边界在哪里。这些用于面试官对某个关键点的追问\n\t\n第三层是细节：\n指标口径、样本量、Prompt 边界 case、A/B 分组、归因逻辑。这些也是追问，有的深扒简历压力面特别喜欢追问这一层（点名某节）\n\t\n所以如果一开始就把第三层放到了第一层，就会显得很重。\n\t\n03｜怎么埋词和埋钩子呢\n…写不下了放评论区\n\t\n总结：\n每一次追问都展开一个节点，讲完之后再回到主线：这个细节如何证明我解决了最初的问题。这样项目就不会越讲越散。\n\t\n#互联网大厂 #面试技巧 #面试 #产品实习","url":"https://www.xiaohongshu.com/explore/6a74aac700000000250130c1","kw":"面试总结"},{"title":"0️⃣互联网经历一周速通字节跳动tts（含面经","author":"Estella Yoo","date":"编辑于 4天前 上海","company":"字节/即梦","dirs":["对齐","数据/评测"],"stages":["一面","二面","三面","HR面"],"city":"未注明","fit":true,"desc":"🕑timeline：\n7.30 投递\n7.31 接到电话了解基本情况，询问base地偏好，约一面\n8.3 一面——半小时后告知通过，约二面\n8.4 二面——10min后告知通过，约三面\n8.5 三面\n8.7 oc，收到正式offer和背调邮件\n\t\n一面（30min）：\n1.自我介绍，过一遍实习经历项目经历\n2.介绍过往处理数据的经历，用过哪些Excel函数处理问题\n3.针对过往某一段实习经历的相关领域出了一道Case，并追问\n\t\n[立马暴富]二面（35-40min）：\n1.自我介绍\n2.分享一段难忘的经历，说明遇到了什么困难、如何解决的、得出了什么结论、做出了什么贡献\n3.针对过往的某一段实习经历，谈谈对该公司所处行业的看法\n4.谈谈对欧洲电商的见解\n（🌟这个问题是因为bg🈶留学经历，且在之前的回答中我有稍微cue到欧洲电商的使用感悟）\n5.过往实习中，同事/导师的评价如何\n6.说说自己的优缺点\n7.反问环节\n\t\n[棒R]三面hr面（25min）：\n1.自我介绍\n2.why字节跳动，why tts\n\t\n一点小反思和经验总结：\n1. 回答问题的表达一定要结构化，case题要体现出自己的分析过程，同时切忌以偏概全\n2. 一定要深挖简历！针对过往实习经历，在熟悉已提交的产出的同时，也要试着去反问自己对公司/行业的现状以及前景的看法\n3. 抓住机会大胆表现自己，体现自己和岗位的适配性\n\t\nAnyway，还是非常幸运能在怎么短的时间内拿到梦中情司的offer！期待这份注定非常充实且充满挑战的工作～[马上转运][马上转运][马上转运]\n\t\n#互联网大厂 #入职 #面经 #字节跳动 #tiktok #oc #留学生求职 #校招 #留学生实习 #留学生秋招","url":"https://www.xiaohongshu.com/explore/6a7ab21f000000000801310c","kw":"秋招面经"},{"title":"27秋招提前批面经！","author":"番茄蛋（秋招版）","date":"08-02 北京","company":"字节/即梦","dirs":["后训练","RL强化学习","多模态","NLP/通用"],"stages":["三面"],"city":"未注明","fit":true,"desc":"投递时间线：7月中开始陆续投递，目前已约面3家（百度/字节/美团，其中节和开水是人才计划），最快进度已约三面，其余还在半永久泡池子...\n\t\n面试体感：八股含量很少了，基本是以介绍项目为主。lc的存在感也在降低，只有字节给了完整的lc题要写出来\n\t\n面试碰到的一些问题：\n1. PPO/GRPO/DAPO/GSPO之间的差异\n2. RL过程如何排查训练问题，从哪些方面出发： 指标趋势/熵/case/val acc\n3. 对于pretrian/post train的看法\n4. 视频和图像的最大差异，哪些方式来解决\n5. RL 过程碰到全对全错怎么处理\n6. 对于OPD的了解\n7. credit assignment\n8. 显存不足的应对方法\n9. RL过程奖励函数设计\n心态：在小崩和大崩之间反复横跳，随着时间的流逝，提前批也要接近中后期，正式批即将到来，希望能够被正经LLM的人才计划捞一把\n#算法 #秋招提前批 #校招 #大模型 #27届","url":"https://www.xiaohongshu.com/explore/6a6efe320000000008012a32","kw":"秋招面经"},{"title":"多模态应用算法实习-Seed 一面面经","author":"Tomie","date":"04-22","company":"字节/即梦","dirs":["后训练","RL强化学习","Agent/自进化","多模态","数据/评测","NLP/通用"],"stages":["一面","二面"],"city":"北京","fit":true,"desc":"写在最前面：第一次面seed，seed的约面有这么紧俏吗？4.15约一面约在一周后，跟hr表示希望早一点进行流程，答复说这是最近的时间。昨天一面后当天约二面，但是二面最早要约到五一后，我还是表示希望提前，再次被拒绝。想问下这个时间线正常吗？\n\t\n回到正题：这次的面试体验很好，和面试官聊的很开心，为我之前尬黑字节道歉。\n\t\n1. 自我介绍\n\t\n2. 问之前的业务，整体的pipeline，cpt和sft有什么不同，然后问知识蒸馏一般是在哪个阶段做。\n\t\n3. 让讲一个最有挑战的项目，讲了正在写的数据合成的论文。问对比其他方法的优势是什么？工作量是几人完成的？论文里为什么用GRPO？方法中提到的RLVR，reward怎么设计和计算的，单单是二元？了解RLVR的缺陷吗？在这个论文场景下怎么优化？\n\t\n4. 问agent相关，有经验吗？说只build过一个关于crop image toolcall的sft数据集，怎么控制crop的坐标，llm在这个坐标上面会引入幻觉吗（导致toolcall的代码崩溃），怎么控制。问agent的架构，然后补充了一些自己的理解，用最近想一个TableQA的agent时候看的一些论文举例。有想过Agent的benchmark该怎么做吗。Harness的理解。了解Agentic RL吗？\n\t\n4. 问了一个场景题：视频通话AI，怎么做到对话过程中也能主动响应。讲了个multi-agent的思路，分别负责视觉意图和响应板机。又问，如果出现打断用户发言的情况怎么办？\n\t\ncoding：1.全排列 2.岛屿数量（时间问题面试官让直接口述）\n\t\n反问：1.业务：主要两块，后训练sft rl agenticrl，agent开发（视频通话、可穿戴设备、手机gui agent），表示还是对后训练感兴趣；2.发表论文情况：鼓励。3.base：北京。\n\t\n这次的面试体验特别好，面试官一直以一个讨论的角度聊想法，卡住的地方会引导，还给了论文一些建议。\n\t\n半天后接到hr电话约二面。\n\t\n#面经 #字节跳动 #seed","url":"https://www.xiaohongshu.com/explore/69e8c303000000001d019c93","kw":"算法面经"},{"title":"字节 agent 开发一面（过）","author":"Mintshoot","date":"昨天 16:09 浙江","company":"字节/即梦","dirs":["Agent/自进化"],"stages":["一面"],"city":"未注明","fit":true,"desc":"#秋招 #agent开发","url":"https://www.xiaohongshu.com/explore/6a801ecd0000000025006f5c","kw":"Agent面经"},{"title":"字节ai coding 二面，八股3问，关注项目","author":"随机场","date":"编辑于 2025-08-23","company":"字节/即梦","dirs":["RL强化学习","Agent/自进化","数据/评测","NLP/通用","ML基础"],"stages":["二面"],"city":"未注明","fit":true,"desc":"最近面了各家秋招，也有不少已经走完所有流程，有空来总结一下。每次面试都会作记录，欢迎关注，我会持续更新。bg看主页，现在主做代码大模型强化学习。\n\t\n字节这次主要面的是ai coding，主要是1️⃣过往经历介绍，2️⃣面试官关心的重点项目提问，3️⃣机器学习ml常识，4️⃣互相提问\n\t\n1️⃣过往经历介绍\n这边主要就是重点突出match的程度，所以尽量提升match工作的表述权重。每个人经历不一样，就不细说了，大家按自己情况来就行。\n\t\n2️⃣面试官关心的重点项目提问\n这次面的ai coding所以面试官对code agent比较感兴趣，也是现在业内都在发力的方向。所以一上来面试官就会问有没有刷swe-bench的经验？有没有做tool use的经验？\n我在实习期间确实主要也是刷benchmark，但主要都是livecodebench那类，swe这种还真刷的少。但参与组里业务的时候，也刷过几次swe，所以就讲了一些自己的经验：1）干了什么、2）有什么效果、3）可迁移的结论、4）发现的问题、5）分析理解等。面试官还算满意\n\t\n3️⃣机器学习ml常识\n主要问了这几个，还算常见，回答参考附图\n- [ ] adam相比于sgd的优势在哪，有什么提升？\n- [ ] max pooling梯度回传怎么计算？\n- [ ] transformer里的multi head attention 有哪些版本？\n- [ ] group query attention 是怎么实现的，简单讲讲？\n\t\n4️⃣互相提问\n一般就表现出自己对组里有一定的了解，问一些比较高质量的问题，可以自行准备，这边就不赘述了\n\t\n#互联网大厂  #大模型 #人工智能 #科研 #秋招 #实习 #读博 #算法 #面试题 #面试求职","url":"https://www.xiaohongshu.com/explore/68a8069c000000001d014eaf","kw":"大模型面经"},{"title":"字节一面 8.11 秒挂","author":"melondesu（秋招版）","date":"4天前 北京","company":"字节/即梦","dirs":["Agent/自进化"],"stages":["一面"],"city":"未注明","fit":true,"desc":"和面试官聊的非常非常好，非常深入，面试官还说整个面试过程非常愉快，然后刚刚收到不通过邮件[嘻嘻R]\n#字节跳动 #字节面试 #秋招 #agent开发 #字节秋招 #校招 #面经 #互联网大厂","url":"https://www.xiaohongshu.com/explore/6a7b0f300000000025006106","kw":"字节面经"},{"title":"字节二面：强化学习中的奖励函数坍缩现象？","author":"Panda师兄的AI笔记","date":"编辑于 04-10","company":"字节/即梦","dirs":["后训练","RL强化学习"],"stages":["二面"],"city":"未注明","fit":true,"desc":"奖励函数坍缩是 RLHF、GRPO 等后训练过程中的关键失效模式。表现为策略输出的多样性（熵）急剧下降，随着训练的进行，entropy 逐渐降低。导致某些 group 采样出的 response 几乎相同，使得模型在早期变得更加确定，限制了模型的探索空间\n\t\n当前主流方法直接将单奖励优化的Group Relative Policy Optimization（GRPO） 应用于多奖励场景：`先对所有奖励求和，再进行组内归一化。但论文指出这一做法存在根本性缺陷——奖励信号坍缩，导致训练信号分辨率下降、收敛次优甚至早期训练失败`。\n#大模型 #ai #面试题 #面经 #转码 #llm #强化学习 #互联网大厂 #字节跳动 #字节面试","url":"https://www.xiaohongshu.com/explore/69d88eab000000001d01bb1e","kw":"强化学习面经"},{"title":"字节剪映多模态一面面经","author":"丸子","date":"04-11","company":"字节/即梦","dirs":["后训练","多模态","数据/评测","NLP/通用"],"stages":["一面"],"city":"未注明","fit":true,"desc":"字节的流程是提问最少的，1h面试差不多一半的时间都是coding。\n最开始2min 面试官先介绍部门，然后面试者自我介绍 简单描述过往经历，包括论文、实习、项目\n1.你自己选你觉得做的最好最满意的一个详细描述，面试官会深挖\n2.你过往的经历中有哪一个是和大模型相关的，请你详细介绍，然后深挖。主包有一段VQA相关的经历，面试官问为什么用CoT的思路来做，不用RAG或者SFT？你觉得三者之间有什么优劣？如果不考虑资源受限的情况，你会不会使用SFT？\n3.你之前的经历中有做过微调吗？说一下具体场景以及你是怎么做的，数据集如何构建？\n然后直接手撕，第一道是手写MLP，用torch，实现很简单，然后追问，如果要把这个MLP用在图像上，你怎么修改？为什么loss用CE，不用MSE？数学上使用MSE是否可行？\n第二道是手写自注意力，然后追问在Attention is all you need一文中，除了Q\\K\\V的注意力计算，还有一个关键步骤是什么？在你实现的代码中要加的话加在哪儿？\n#字节 #剪映 #多模态 #日常实习 #算法实习 #面经 #互联网大厂","url":"https://www.xiaohongshu.com/explore/69d9abf9000000001a023449","kw":"字节面经"},{"title":"字节多模态大模型日常实习一面面经","author":"巧克力秋千","date":"07-20 福建","company":"字节/即梦","dirs":["后训练","RL强化学习","多模态","对齐","数据/评测","NLP/通用"],"stages":["一面"],"city":"未注明","fit":true,"desc":"面试时长约70分钟，面试官人很nice，面试体验很好。\nbg2本9硕，无实习经历，简历是被业务捞上来的，只有一篇在投论文和自己做的项目，面试的主要内容也基本围绕简历展开，无手撕\n\t\n1min自我介绍\n论文相关提问，30min左右：\n1. 论文的motivation & method & backbone & 论文创新的实现方案；\n2. 论文用到的评测指标，怎么做的消融和可视化；\n3. 有没有了解过论文领域最新的研究进展；\n4. 论文具体改进了什么，相较于已有方案有什么提升；\n5. 论文领域和通用场景存在的差异；\n因为论文和岗位完全不match，面试官也承认了他在这方面领域了解不够充分，所以给了很长时间让我来讲故事，但是我第一次面试，在表达上有很多细节都没能处理好，感觉讲得不够清楚。\n\t\n项目与八股相关提问，30min左右，项目提问过程中穿插八股。这里我自己准备了一个think with image的项目，涉及到了SFT、RL和OPD：\n1. 介绍项目的基本情况，为什么要做这个项目（这里感觉答得不好，没有包装到位）；\n2. 模型的选型、后训练方法的选型、数据的来源（面试官似乎很看重“为什么要选某一种后训练方法”，自我反思后觉得更多像是跑通了一个流程，没有比较出不同方法的差别）；\n3. 训练过程（SFT + RL + OPD），自我感觉OPD蒸馏步骤完全没有用，模型的主要能力提升还是在SFT步骤上，RL带来的提升也相对较小；\n4. RL奖励函数的设计方法，规则奖励带来的问题，训练后模型是否对输出存在某种偏好，是否存在一些bad case，是否发生了reward hacking，实际怎么解决的；\n5. 八股吟唱：SFT、RL、OPD的区别、使用场景，什么是熵坍缩、改进方法，GRPO相较于PPO的改进，GRPO训练过程，GRPO存在的问题以及后续对GRPO的改进（三种动机+改进）；\n6. 有没有想过teacher模型logits不可获取的情况下，怎么做OPD；项目用到了OPD，但是teacher模型和student词表存在差异，怎么做的跨词表OPD，OPD的优化目标；\n\t\n反问环节，主要问了具体的业务、希望实习生能做什么，面试官很详细地介绍了他们招募实习生的动机、业务规划和方向，并且提出了组内希望实习生做的几个方向。\n五天后挂\n自我反思：项目太玩具了，选择的模型有问题，后训练可能更需要有实操经验的？","url":"https://www.xiaohongshu.com/explore/6a5e2f610000000001032024","kw":"大模型面经"},{"title":"字节本地生活 AI Agent岗三轮技术面，贼难","author":"冒个泡泡.","date":"7天前 湖北","company":"字节/即梦","dirs":["Agent/自进化","数据/评测","搜推","NLP/通用","C++/工程"],"stages":["技术面","多轮"],"city":"未注明","fit":true,"desc":"Round 1：BQ\n主要问了两个问题：一次简化复杂系统的经历；当用户体验和业务指标冲突时如何取舍。\n我用 STAR 结构讲了推荐流去重服务的优化。当时通过调整架构和缓存策略降低了接口延迟与系统负载，并用优化前后的数据对比说明效果。面试官随后追问了技术选型和取舍依据。\nRound 2：Coding\n题目要求计算棋子在棋盘上的可达位置，共分三步。\n第一步实现皇后的移动，沿横、竖和对角线扫描；第二步加入障碍物，用 HashSet 保存坐标，某个方向遇到障碍物后立即停止；第三步支持 Queen、Bishop 和 Rook，根据 pieceType 配置不同方向，其余扫描逻辑共用。\n建立障碍物集合需要 O(b)，方向扫描需要 O(n)，总时间复杂度为 O(n+b)。\nRound 3：System Design\n第一题是广告事件聚合。广告事件包含 adId 和 servingId，用户事件包含 servingId、点击或曝光行为以及地区，要求按 (adId, action, region) 生成 Dashboard。方案是用 Kafka 接收事件，Flink 完成流式 Join 和聚合，Redis 保存 servingId 映射，结果写入 OLAP 数据库。\n第二题是商品目录批量上传，单次最多 50 万件商品。更合理的设计是先把文件上传到对象存储，再通过任务 ID 异步解析、校验和批量入库，客户端可以查询进度并重试失败数据。这题提醒我，数据库选型前要先问清读取频率、更新方式和一致性要求。\nRound 4：Coding\n题目给出一组被打乱的车票，每张票记录出发地和目的地，要求恢复完整路线。\n用 Map 保存出发地到目的地的映射，再用 Set 记录所有目的地。没有出现在目的地集合中的出发地就是起点，之后沿映射依次还原路线。\nFollow-up 讨论了重复出发地、路线成环、多条不连通路线以及车票未全部使用等边界情况。\n#互联网大厂 #agent #大厂人 #校招生 #春招#春招入口 #java编程 #大厂 #大模型面试 #互联网大厂实习","url":"https://www.xiaohongshu.com/explore/6a76b6cd000000002c0011a6","kw":"Agent面经"},{"title":"字节筋斗云人才计划面经时间轴（2）","author":"Carton","date":"编辑于 07-13","company":"字节/即梦","dirs":["多模态","对齐","ML基础"],"stages":["二面","三面","四面","HR面"],"city":"未注明","fit":true,"desc":"7月了，最近会发一些我去年秋招的面经，大家加油！\n\t\n（接上一篇笔记，因为拒了offer所以换了组继续面，从二面开始）\n二面8.4\n* 先对齐了我想找什么样的岗位\n* 先问电商实习，聊多模态项目。\n* 无代码。因为前面几面代码写不少了。问了个智力题：把一个线段随机切三份，求组成三角形的概率？（线性规划几何分布：1/4）\n\t\n三面8.7\n* 自我介绍：讲脉络图（还不知道脉络图的同学看我主页笔记\n然后居然问了问时序的项目问题，问了问癫痫检测怎么应用，应用时是否有加速问题。\n* 然后做代码：\n1、从n个数取m个数，求所有可能的组合（dfs）；\n2、用numpy实现一个MLP，不需要激活层，需要前向和反向传播。不要求运行。\n* 继续聊项目，长视频和商品理解都问了。\n* 面试官人挺好，交流起来很平易，看上去很年轻。最后说他做的跟我经历比较相似，期待以后一起做。后面知道了确实是一位大佬。\n\t\n四面8.11：交叉面\n* 自我介绍：讲脉络图。然后让我介绍了脑电系列工作（居然不问LLM相关的，可能是因为前面LLM问太多了，所以换一些项目问）\n* 做代码：给定一个数的各个数位，把其中两个数交换位置（只交换一组）使得得到的数字值尽可能大，输出得到的数字值。答：先降序排列，然后从左往右遍历找第一个不一样的。\n追问：这个是什么时间复杂度？有没有O(n)的思路。继续答：可以先从右往左扫描，记录下来每个数右边第一次遇到的比它大的数。之后写了代码。\n* 时间还没到，让再讲一个商品理解项目。讲完也没问问题，直接结束了。没有反问环节（可能是因为交叉面）\n* 面试官人挺好，交流起来也很平易，看上去也很年轻。\n\t\nHR面8.14\n* 一直跟进招聘的HR，人很好（感觉字节HR人都普遍比较好）。还有一位HRBP\n* 关于项目经历的问题，为什么选择换实习，职业规划，为什么不继续读博，过往经历带给你的收获是什么，自己找工作时看重哪些方面，其他offer的情况，家是哪里的。告知会按照筋斗云提报到集团，后面集团可能有加面。\n\t\n9月初拿筋斗云意向\n\t\n整体来讲，字节的面试还是相对硬核一点，强调聪明感和硬实力，本来以为自己不会这么早就面通的，好在关关难过关关过\n\t\n更多经验分享，点点关㊗️都能找到哦\n\t\n#互联网大厂 #面经 #大模型 #秋招 #斩获offer的秘诀 #求职","url":"https://www.xiaohongshu.com/explore/6a54efd40000000016026256","kw":"字节面经"},{"title":"字节跳动27届秋招 火山方舟 Agent 一面面经","author":"孤飞","date":"2天前 浙江","company":"字节/即梦","dirs":["Agent/自进化","AI Infra","搜推","NLP/通用"],"stages":["一面"],"city":"未注明","fit":true,"desc":"【精品面经】面试时长约 57 分钟，整体是项目深挖、Agent 原理、后端基础和现场手撕。问题会沿着回答继续追问，Agent 方向的项目经历和传统后端基础都会考。\n推荐Agent面试八股文题库：https://github.com/ranxi2001/zero2Agent\n\t\n一、个人背景\n27 届计算机硕士，主要经历集中在 Agent、量化开发和 Agent Infra，目前在做 Agent Runtime 及相关开源项目。\n\t\n二、项目经历深挖\n面试官先让我做自我介绍，之后重点聊了最近的 Agent Infra 实习\n\t\n三、Agent 原理\n接着从“给 Claude Code、Codex 或其他带工具调用的 Agent 输入一段话，到页面展示最终结果，中间发生了什么”开始追问：\n一次 Agent 请求从用户输入到最终回答的完整链路是什么？\n大模型如何判断是否需要调用工具？\nFunction Call 和 Tool Result 如何重新进入模型上下文？\nAgent Loop 在什么条件下继续执行，又在什么条件下结束？\nReAct 是什么？循环中的关键步骤是什么（解释命名单词中的两个步骤Reasoning+Action）？\n平时主要使用哪些 Coding Agent？\n如何用 Coding Agent 完成项目开发？\n什么是 Context Engineering？如何为开发、测试、运维等任务组织 Skills？\n如何用 Agent 做 Auto "AI Infra","数据/评测","C++/工程"],"stages":[],"city":"未注明","fit":true,"desc":"【核心结论】\n选型看三件事：模型规模（中小 vs 超大 MoE）、团队阶段（上手 vs 生产）、训练范式（同步 vs 异步）。\n\t\n一、 一分钟对比\nverl（字节）：训练与推理引擎解耦（支持 vLLM/SGLang），上手快、生态活。适合中小模型（7B-70B）、算法魔改与快速实验。\n\t\nslime（清华/智谱）：Megatron-LM + SGLang 原生绑定，深耕 MoE 与通信优化。适合千亿级 MoE 训练、长链路 Agent 异步训练。\n\t\n二、 核心公式与概念\n【数据对齐硬约束公式】\nBr * n = Bg * s\n\t\nBr (Rollout Batch) * n (单 Prompt 采样数) = Bg (Global Batch) * s (单次更新步数)\n\t\n含义：保证生成的样本总量刚好喂饱一次训练更新，避免 GPU 处于饥饿等待状态。\n\t\n【关键概念】\n\t\nOn/Off-policy：前者仅用当前最新模型生成的样本训练；后者复用历史样本（异步模式常用）。\n\t\nAsync（异步）：生成与训练重叠并行，用样本缓冲区掩盖长 Rollout 时间，极大地提升 GPU 利用率。\n\t\n三、 高频面试追问\n算法层有差异吗？\n答：无本质差异，均支持 GRPO/PPO/DPO。差异在工程架构：verl 赢在 Backend 灵活与社区生态，slime 赢在 Megatron 深度优化与超大 MoE 吞吐。\n\t\n何时必须开异步（Async）？\n答：长 Reasoning 或多轮 Agent 工具调用导致生成极慢、同步模式下 GPU 大量闲置时。用历史样本掩盖 Rollout 耗时。\n#infra #面经 #强化学习 #verl #slime","url":"https://www.xiaohongshu.com/explore/6a5ec63c000000000101db50","kw":"后训练面经"},{"title":"面试时如何讲好项目故事：后训练篇","author":"不爱敲代码","date":"03-18","company":"字节/即梦","dirs":["后训练","数据/评测"],"stages":[],"city":"未注明","fit":true,"desc":"后训练项目的逻辑要完整，不要只讲算法本身，要关注数据和评测，并结合 bad case 进行分析。\n\t\n#互联网大厂 #暑期实习 #春招 #大模型 #面试技巧 #面经 #后训练 #字节 #腾讯 #算法","url":"https://www.xiaohongshu.com/explore/69ba65610000000022002d6e","kw":"后训练面经"},{"title":"小米基模二面，agent八股+实际问题如何解决","author":"随机场","date":"2025-09-13","company":"小米","dirs":["后训练","Agent/自进化","基座/预训练","数据/评测","NLP/通用"],"stages":["二面"],"city":"未注明","fit":true,"desc":"小米大模型基模团队面试问的问题非常硬核，很考察agent基础知识，agent实操经验。看起来是要加码agent赛道了。面试问题：\n\t\n- [ ] Claude为啥能刷榜又强，实测又好？\n- [ ] 预训练的时候最重要的是什么？\n- [ ] 预训练如何融入swe能力？\n- [ ] 后训练提升swe能力的关键是？\n- [ ] Agent 训练的数据如何获得？\n\t\n#大模型 #人工智能 #算法 #面试 #秋招 #互联网大厂 #找工作 #大学生 @校招薯","url":"https://www.xiaohongshu.com/explore/68c5690c000000001d01207a","kw":"大模型面经"},{"title":"小红书基座大模型后训练面经","author":"天上的彤云","date":"04-10","company":"小红书","dirs":["后训练","RL强化学习","基座/预训练","AI Infra","NLP/通用"],"stages":["一面","二面"],"city":"未注明","fit":true,"desc":"跟面试官聊得很开心，给我出的手撕很简单。\nxhs的面试官是唯一不是小同行还能在短短几分钟内理解我的论文的人， l":"https://www.xiaohongshu.com/explore/69f04dfb00000000370342c0","kw":"腾讯面经"},{"title":"腾讯青云人才计划实习面经","author":"Jamie","date":"编辑于 05-03","company":"腾讯","dirs":["后训练","RL强化学习","基座/预训练","数据/评测","NLP/通用"],"stages":["一面","二面","HR面","多轮"],"city":"未注明","fit":true,"desc":"一面\n面试官对我刚入学那会训垂域模型经历感兴趣\n增量预训练如何做的？数据为什么要这样配比？\n你认为SFT到什么程度才最适合去做RL\n当时为什么不用PPO做RLHF？\nDPO训练开始前如何评价你构造的数据质量？\n（接下来针对论文拷打了半小时）\n总体时间一个小时20分钟\n无手撕\n\t\n五天后 二面\n面试官对我的论文感兴趣，基本全程论文拷打，无八股相关 拷打一个小时\n手撕题目\n两两成对的字符串中找到只出现一次的元素，要求最优方案\n使用哈希表解完，面试官提示用二分做更优方案，可惜大脑宕机实在没想出来\n\t\n更新分割线———————\n4.28 通过+HR面\n聊一聊基本信息，毕业时间，部门的情况之类的信息\n其次青云需要再和组内协商看是否能给出\n面试体验很好，就是感觉青云貌似不是很稳，不知道可不可以用其他offer A到青云实习 #面经 #互联网大厂实习","url":"https://www.xiaohongshu.com/explore/69f0ef69000000003603162c","kw":"腾讯面经"},{"title":"蚂蚁集团 RL Infra 面经｜真正在筛的是什么？","author":"学长学姐帮","date":"07-15","company":"蚂蚁","dirs":["后训练","RL强化学习","Agent/自进化","对齐","AI Infra","数据/评测","C++/工程"],"stages":[],"city":"未注明","fit":true,"desc":"1️⃣解耦与系统级并行优化能力，非纯算法。\n需熟知两大自研资产：AReaL（完全异步RL系统，Rollout与Training解耦，加速2.77倍且精度不降）与AWorld（Agentic训练框架，推理与训练解耦，加速14.6倍）。\n\t\n2️⃣ 统一并行模式，拒绝通信死锁\nFSDP vs Megatron： 原生FSDP等价于ZeRO-3（参数/梯度/优化器状态全分片）。13B以下模型、需快速验证选FSDP（显存低、调试快）；30B以上大Batch多机长时训练选Megatron（通信可控，保障生产确定性）。\n\t\n工程死锁坑： 在verl等框架中，Actor与Critic等所有角色的并行模式必须绝对统一。若贸然混搭，会因底层通信进程组（Process Group）生命周期冲突直接触发NCCL死锁。\n\t\n3️⃣攻克推训不一致与异步数据偏移\n推训一致性： Rollout推理端（vLLM/SGLang）与Training端算子路径不同会导致logprob对不齐。必须通过固定FlashAttention和PagedAttention的分块策略等底层手段强行对齐数值。\n\t\n异步算法兜底： 同步RL会因长文本生成的“木桶效应”导致GPU空转。AReaL采用异步架构提升吞吐，但引入数据过时（Staleness）和策略版本不一致问题。对此，系统引入Staleness-Aware Training（控制最大过时度并优先处理旧轨迹）与Decoupled PPO（分离行为与近端策略，通过重要性采样放宽单策略假设）进行算法兜底。\n\t\n4️⃣ 架构防拷打：三段式应答模板\n面对面试官“为什么不用方案X”的追问，切忌盲目硬杠，应采用三段式逻辑：\n\t\n承认优点（如：肯定Megatron在超大模型多机通信上的可控性）；\n\t\n场景约束（如：阐述团队当时基于7B模型快速迭代，Megatron权重转换成本过高的实际边界）；\n\t\n演进路径（如：明确后续若升级至长程推理或超大参数量时，切到异步或Megatron的演进规划）。\n#infra #面经 #蚂蚁 #RL #强化学习","url":"https://www.xiaohongshu.com/explore/6a56e45c000000001503f69e","kw":"强化学习面经"},{"title":"stepfun阶跃星辰基座组后训练一面","author":"手撕大灰狼","date":"03-25 ","RL强化学习","NLP/通用","C++/工程"],"stages":["一面","二面","三面","HR面"],"city":"未注明","fit":true,"desc":"也是当上🐧孝子了，写个面经积攒下人品\n\t\n3.18一面\n项目聊了50min\nLC考了一道字符串的括号匹配问题，面试官要求先说想法再写代码\n还问了一个具体的游戏场景问题的解决方案\n反问环节问了业务工作内容\n面试官叫一周内等通知\n\t\n3.24收到二面邀约\n3.25 二面\n整体像交叉面\n项目25min\n八股部分：\n为什么KV cache而Q不用cache？\n简单讲下qwen3vl的核心创新点\n谈论下GRPO相比DPO的优缺点，什么情况下二者几乎等同\n后面手撕LC链表求和以及手撕MHA，写完问了contiguous的作用\n同样有场景题\n反问环节同一面\n\t\n（二面到三面等了好久主包都以为挂掉了...）\n4.8约三面，真的很惊喜\n4.9三面ld面\n主要问了项目，深究了cv方面的几个点，然后提出了一个难点问如何解决\n项目大概20分钟\n反问环节问了在这个岗位长期发展的人都有啥特征\n🈚手撕\n整个面试过程还是挺愉快的\n\t\n4.10挂了...我万万想不到\n那天整个人都不好了因为不理解三面哪里面的不好了然后就安慰自己说没有HC了\n4.13，4.14开始刷简历等别的部门捞\n\t\n4.15约面+云证\n一开始以为是别的部门捞的结果是原部门！复活了说是\n4.17HR面\n反问环节问为什么把我挂了说是系统自动挂的😢\n4.20 oc，当天下午offer\n————————————————————\n#oc #腾讯校招 #27暑期实习 #面经 #timeline","url":"https://www.xiaohongshu.com/explore/69e7a6de0000000022026ba0","kw":"腾讯面经"},{"title":"大模型|业务基模组实习复盘","author":"xixi","date":"04-12","company":"阿里/Qwen","dirs":["后训练","RL强化学习","Agent/自进化","基座/预训练","数据/评测","搜推"],"stages":[],"city":"未注明","fit":true,"desc":"刚结束在小红书的大模型岗实习，用本文纪念这匆匆而过的八个月。\n\t\n在拿到这份实习前，我遇到了很多困难。我想，现在或许很多人也在找大模型实习，或许会像当时的我一样遇到困难。\n\t\n这篇内容主要是我在实习过程中积累的技术经验，希望对你有帮助。\n\t\n看到标题，你可能会好奇：什么是业务基模组呢？\n\t\n我们知道，像腾讯的混元、阿里的千问都属于基础模型，它们在数学、代码等各种公开评测集上表现优异。\n\t\n而业务基模，是主要专注业务场景上的评测表现，同时保证公开评测集上和基础模型能力或者略好。\n\t\n它和其他业务组的区别在于，一般的业务组可能专门做搜索、广告等业务，而业务基模组的目标，是通过模型训练，让同一个模型在多个业务场景中，都能比基础模型表现更好。\n\t\n业务基模组对公司来说有一定的业务价值，同时也是一个比较容易产出技术报告的方向。\n\t\n本篇内容分为以下几个部分：Pretrain、CPT、SFT、RL 以及评测。主包做数据工作比较多，因此内容中讲数据会讲得更细一点。\n\t\n具体请看图片啦～\n\t\n从字数可以看出，主包对RL还很不熟啊。。我从三月开始面试，可以明显感到Agentic RL 是面试官非常希望我掌握的一个技术，但我目前还没深入看项目，这是我接下来这一个多月要努力去做的方向。\n\t\n我曾很想去基座组，但作为没有论文的人，我没有收到过基座组的面试，而像字节搜索这样的业务组则会觉得我做的和他们不够match。\n\t\n我很好的朋友告诉我，可以先现实一点，去业务组的话后面秋招能有更多的相关岗位。\n\t\n我下一段决定去快手做Chatbot 了，后续也会更新实习体验、在快手学到了什么。\n\t\n基座组或许依旧是我的长期目标，我不知道还需要多久，但追寻不可得之物我想也会是有趣的体验吧\n#互联网大厂实习 #大模型 #暑期实习 #计算机专业","url":"https://www.xiaohongshu.com/explore/69daf7260000000023027d59","kw":"面试总结"},{"title":"大模型算法社招超全记录（20+大厂，140+问题）","author":"小red同学","date":"编辑于 02-25","company":"阿里/Qwen","dirs":["后训练","RL强化学习","Agent/自进化","基座/预训练","数据/评测","NLP/通用","C++/工程"],"stages":["一面"],"city":"未注明","fit":true,"desc":"背景：9本物理上交硕ee，腾讯1.5年\n\t\n25.11-26.01面了 淘天、Qwen、字节、元宝、minimax、阿里云、美团、阿里国际、蚂蚁、小红书、商汤、快手、九坤、面壁 等\n\t\n整体感受：都说外面大环境不好，但面完发现AI需求非常大的，基座给的非常猛（朋友给了200w💰，但业务组依然很拉）\n\t\n但整体非常难，开始一直挂😭，很多问题答不上来/被喷背八股，面多了就好了，更看重技术前沿性&广度&深度 + 业务理解 + 工程落地能力\n\t\n经常被问一个月前发的 paper，尤其是 RL（PPO/GRPO/DPO/reward model）、数据合成（agentic SFT、RL和评测）、训练系统（ZeRO/并行/KV cache）这几块\n\t\n详细的记录见图！\n#互联网大厂#大模型算法#ai #agent #面经 #社招跳槽@职场薯 #2026校招季","url":"https://www.xiaohongshu.com/explore/699d9d000000000015032a8b","kw":"强化学习面经"},{"title":"大模型算法面试八股总结","author":"momo无闻","date":"编辑于 05-30","company":"阿里/Qwen","dirs":["RL强化学习","Agent/自进化","AI Infra","NLP/通用"],"stages":[],"city":"未注明","fit":true,"desc":"体感面试官不太关注八股了，但整理出来希望能帮助有需要的同学\n主要分为llm训练，rl算法，agentic rl，infra，agent框架这几大类\nps：仅供参考，面试主要围绕个人经历展开\n#大模型算法 #面经 #腾讯 #阿里 #字节 #小红书 #蚂蚁 #淘天 #互联网 #暑期实习","url":"https://www.xiaohongshu.com/explore/6a1ac5900000000035026578","kw":"大模型面经"},{"title":"字节大模型算法实习面经","author":"Qrlary","date":"编辑于 06-02","company":"阿里/Qwen","dirs":["后训练","RL强化学习","搜推","NLP/通用"],"stages":["一面","二面","三面","HR面","多轮"],"city":"未注明","fit":true,"desc":"1️⃣一面 1h（两小时后约二面）\n1.介绍两个项目\n2.claude code记忆设计\n3.transformer八股集合：attention，除dk layernorm，rmsnorm，ffn，swiglu，moe，lora和初始化，gqa\n4.讲讲qwen3/qwen3-next\n5.sft和rl区别\n6.dpo相比于ppo的改进\n手撕：路径总和III\n\t\n2️⃣二面 1h10min（十分钟后约三面）\n1.自选一个项目介绍\n2.bce偏导怎么算\n3.几个场景题（怎么用后训练解决某个业务相关问题）\n4.以1b模型为例，sft和grpo阶段显存开销\n5.flash attention的优化\n手撕：grpo loss，讲各个tensor的shape\n手撕：交叉熵\n手撕：batch累积的均值和方差（类似batchnorm）\n手撕：dp一题，介于mid-hard难度，非leetcode\n\t\n3️⃣三面 1h（十分钟后约hr面）\n1.自选一个项目介绍\n2.场景题\n3.前向kl和反向kl区别，和交叉熵关系，哪些方法在用\n4.ppo和grpo用的什么kl，有偏还是无偏，作为reward shaping和trust region约束的本质区别\n5.有哪些kl估计的形式\n6.讲讲opd\n7.qwen3 ffn\n8.qwen3vl位置编码\n9.deepseek v4哪些创新\n手撕：搜索旋转排序数组\n\t\n4️⃣hr面 20min（半天后oc）\n八股盛宴+穿插各类手撕，属于是字节一向的风格了，比较考察基础知识的广度，项目相关的八股需要仔细准备下。面试结果的反馈极其效率，全程不到一周","url":"https://www.xiaohongshu.com/explore/6a1dceca000000002202a534","kw":"字节面经"},{"title":"字节跳动一面面经","author":"晴天","date":"编辑于 7天前 浙江","company":"阿里/Qwen","dirs":["Agent/自进化","多模态","数据/评测","搜推","C++/工程"],"stages":["一面"],"city":"未注明","fit":true,"desc":"个人认为字节很重视工程落地的能力，会深挖项目。\n怎么衡量用户问的问题是不是语义一样？\n你的论文工作内容大概做了哪些事情？RAG 怎么建的，数据用的是什么？\n评测集是从哪里找的？\nRAG 的构造流程是怎么做的？\n文档解析为什么选择 MinerU 和 PaddleOCR-VL？\n语义切分是怎么切分的？\n如果文档结构不清晰怎么办？\n为什么不用基于 embedding 的语义切分？\nMinerU 大概是怎么实现的，为什么解析质量好？\n文档切好并计算 embedding 之后，入库时还要保存哪些信息？\n检索阶段怎么做，为什么混合检索效果更好？\n向量检索的原理是什么，为什么速度快，为什么可能效果差？\n粗排之后还有哪些优化点？\n你在这个过程中做得最有深度的点或者难点是什么？\n主要迭代了哪几个点，哪些点对效果提升比较明显？\nDeepLocals 创业项目的背景是什么，解决什么用户问题？\n这个产品是电脑端还是手机端，用户量和商业化情况怎么样？\nEmbedding 用的是什么模型，为什么选择它？\nAdaCache 论文的核心亮点是什么？\n论文具体解决了哪类 badcase？\n语义缓存的整体逻辑是什么？\n自适应阈值是怎么根据密度分布或 SNR 控制的？\n你对哪个模型最了解？\n说一下你对 Qwen 模型的理解。\nQwen 的具体模型结构你了解吗？\n说一下你对 Agent Harness #面经 #秋招提前批 #互联网大厂实习 的理解。\nAgent Harness  里面可能有哪些原则或设计理念？\n怎么证明你的自驱力和学习能力比较好？能给一两个 case 吗？\n技术上你觉得比较深入的点是什么？\n这个岗位主要做数据层级，你对岗位方向有什么理解？","url":"https://www.xiaohongshu.com/explore/6a509f80000000001101ac44","kw":"字节面经"},{"title":"字节跳动暑期实习面经｜筋斗云✨","author":"27秋招废物","date":"04-11","company":"阿里/Qwen","dirs":["后训练","数据/评测","NLP/通用","ML基础"],"stages":["一面","二面","三面","四面","终面","多轮"],"city":"未注明","fit":true,"desc":"写个贴给自己复盘用，也给备战的uu一些参考～\n\t\n虽部门不核，但我水平也就到这了，剩下秋招前几个月好好干吧，不来回折腾了。\n\t\n一面：\n整体难度：⭐⭐\n✅ 面试流程：\n自我介绍→深挖实习经历\n📚 八股文考点：\n1. 大模型decoder基本框架\n2. 传统机器学习+树模型掌握情况\n3. 特征划分的标准\n💻 代码题：链表求和\n总结：这一轮很基础，重点看实习经历真实性和基础知识点掌握，代码题也很常规。\n二面：\n整体难度：⭐⭐⭐\n✅ 面试流程：\n自我介绍→实习细节深挖\n📚 八股文考点（全是LLM相关发散）：\n1. 如何解决OOD问题\n2. 不重新训练的外展方案（例：新增POI类别不重训）\n3. 多行业数据迭代，保证新旧任务效果的方法，SFT指令遵循问题解决\n4. SFT冷启动相关问题\n5. 从Rollout角度分析RL适用时机\n💻 代码题：单链表反转\n总结：这一轮实习相关的发散问题和八股超多，很考察对项目的理解和临场思考能力。\n三面：\n整体难度：⭐⭐⭐⭐\n✅ 面试流程：\n自我介绍→实习经历提问\n📚 八股文考点（纯LLM硬核知识，无代码！）：\n1. qwen3多阶段训练方案\n2. qwen3相比qwen2的优化点（要求答2-5点）\n3. MOE结构详解\n4. MOE路由机制原理\n5. MOE专家网络与非MOE模型，在参数量、维度上的差异\n6. Transformer中Decoder与Encoder的核心差异\n7. qwen采用的位置编码，原生绝对位置编码相关问题\n8. qwen3的MOE专家数量\n总结：纯八股，全是大模型底层基础知识。\n四面：\n整体难度：⭐⭐\n✅ 面试流程：\n自我介绍→实习内容细节深挖\n📚 八股文考点：\nCPT与SFT的区别\n💻 无代码\n总结：终面更看重实习细节，考察你做过的项目是不是真的吃透，有没有自己的思考。\n\t\n个人心得\n全程下来运气真的很好，四轮都很快通知顺利通过\n建议备战的小伙伴：\n🔹 实习经历反复梳理，每一个细节都能说清\n🔹 LLM八股文、传统机器学习基础背熟吃透\n🔹 代码题刷高频题，链表相关是字节常考点\n祝大家都能拿到心仪offer💪\n#字节面经 #字节跳动面试 #实习 #暑期实习 #大厂面经 #LLM面试 #算法面试 #筋斗云 #求职干货 #面试经验","url":"https://www.xiaohongshu.com/explore/69da0d64000000001e00f8bb","kw":"字节面经"},{"title":"我自己的大模型八股路线-暑期实习","author":"Nan","date":"编辑于 04-03","company":"阿里/Qwen","dirs":["后训练","RL强化学习","Agent/自进化","多模态","AI Infra","数据/评测","搜推","NLP/通用"],"stages":[],"city":"未注明","fit":true,"desc":"谁能想一个月学了这么多东西\n但是里面的内容比较乱 基本上就是复制ai和自己的一些理解 只适合我自己看\n所以只给大家大纲参考了\n\t\n# 一、八股知识\n### 1. Transformer\n- Attention 机制\n- Flash Attention/ Paged Attention/ GLA\n- 评估\n- MMLU / MT-Bench / LMSYS\n### 2. 高效微调\n- -1. 全参数微调\n- 1. 指定式\n- 2. 增量式(prefix tuning, ptuning1, ptuning2)\n- 3. 重参数化\n- LoRA/ AdaLoRA/ QLoRA\n- 总结对比\n### 3. RLHF\n- 核心算法\n- RLHF 概述\n- PPO/ DPO/ GRPO\n- 其它强化算法\n- KTO / GSPO / MPO / DAPO / SIMPO\n- RW (其他策略如生成式奖励模型)\n### 4. Agentic\n- RAG\n- 指标：忠实度等\n- 检索：BM25、Embedding、BGE-M3\n- 倒排索引\n- Agentic RL\n- Memory\n- Self-improving\n### 5. 损失与激活函数\n### 6. 多模态\n-多维度位置编码\n绝对/相对2D 编码 /2D-RoPE /M-ROPE/Interleaved ROPE/ iRoPE\n- ViT + CLIP 家族\n— ViT/ VLM\n— CLIP\n— SigLIP / SigLIP2\n- BLIP 家族\n— BLIP / BLIP-2/ BLIP-3\n### 7. Infra\n- 通信原语\n- 并行策略 （dp tp ep pp sp ）\n-DeepSeed策略\n\t\n## 二、 技术报告\n### 1. 大模型\n- Llama 3\n- deepseek-R1 / deepseek-v3\n- Qwen3 /Qwen2.5 Coder\n-  kimi2.5/ InternVL1.5/3/3.5\n### 2. Agent\n- AFlow / MetaGPT/ Cursor / Manus / SWE Agent / Claude\n- 评测: SWE Bench","url":"https://www.xiaohongshu.com/explore/69cdf81f000000002903014b","kw":"算法八股"},{"title":"暑期实习面试总结","author":"Jason","date":"编辑于 05-14","company":"阿里/Qwen","dirs":["后训练","基座/预训练","数据/评测","NLP/通用"],"stages":["一面","二面","三面"],"city":"未注明","fit":true,"desc":"经过一个多月的面试，从自己的感受对面试的团队进行一个小小的排行，基模团队的所有面试官确实非常nice，每个老师都非常懂，甚至在面试的时候可以share一些很不错的insight。（因为我只面后训练的方向，所以肯定存在以偏概全）\n\t\n排行仅代表个人面试体验，不代表实际情况：\n\t\nQwen团队：夯，可惜主播时运不济，面试过了，但没hc了，老师确实太忙了想约早一点也没办法。\n微信基座welm：夯，面试过程感觉没并没有登味，也问了一些比较有意思的问题，这个是最先拿offer的，这里给到 00000021010f11","kw":"强化学习面经"},{"title":"研一小登一个月传奇耐面经历","author":"手撕大灰狼","date":"编辑于 03-24","company":"阿里/Qwen","dirs":["后训练","Agent/自进化","基座/预训练","NLP/通用"],"stages":["一面","二面"],"city":"上海","fit":true,"desc":"记录一下自己过去一个月的大模型面试经历\n春节返校之后就开始陆陆续续找日常实习了，最开始经常因为手撕写不出来挂，面久了之后现在基本能秒了。总结一下我过去一个月的面试经历：\n\t\n阶跃后训练 一面挂❌\n美团longcat 一面挂❌\n小红书大模型 一面挂❌\n上海Ai Lab 一面挂❌\n高德大模型research 二面完横向挂 ❌\n九坤预训练 二面挂❌\n京东agent 二面主动结束❌\n千问c端 二面主动结束❌\n微信风控 二面主动结束❌\n微信大模型 二面主动结束❌\n面壁大模型 二面主动结束❌\n懂车帝大模型 二面主动结束❌\n\t\n腾讯大模型research ✅\nteleai大模型research ✅\n快手风控 ✅\n阿里大模型 ✅\n字节大模型 ✅\n#互联网大厂 #大模型 #面试求职 #面试问题 #校招","url":"https://www.xiaohongshu.com/explore/69c28d88000000001e00dd7f","kw":"面试总结"},{"title":"美团北斗计划秋招面经-大模型算法","author":"wkleak","date":"04-24","company":"阿里/Qwen","dirs":["后训练","RL强化学习","Agent/自进化","基座/预训练","AI Infra","数据/评测"],"stages":["一面","二面","三面","四面","笔试"],"city":"未注明","fit":true,"desc":"一面\n1. 介绍第一篇论文，reward model 怎么设计。\n2.过程监督的信号具体是怎么设计的。过程监督的信号还能应用在哪些地方。\n3. 如何保证强化学习的训练效率（平衡效率和稳定），grpo训练过程中出现了全0或者全1怎么解决。\n4. 混合推理是怎么做的（OpenAI GPT-5），大模型在增强推理的时候如何保证通用数据不遗忘。\n5. 现在大模型还有那些能力值得增强。\n6. 介绍第二篇论文\n7. 介绍第一段实习，介绍落地的场景。\n8. 写题，非hot100的模拟\n\t\n后续一面面试官来问能不能先北斗实习，秋招很忙遂拒绝[完啦R]\n\t\n二面\n1. 介绍第二段实习，中间会打断提问，问看过qwen2.5-vl的报告了吗，问具体业务细节，强化学习数据集的构建方法，问部门几个人\n2. 介绍第一段实习，主包这一段实习是基座的，问了很多部门的情况，包括后训练、预训练、数据生成等等\n3. 介绍第一篇论文，介绍背景和方法\n4. 面试官感觉很真诚，共享屏幕介绍他们组的业务\n\t\n三面\n1. 问是保研的吗，论文是研究生阶段发的吗，大四在干什么，研究生的毕业论文写好了吗，两篇论文是一个领域的吗\n2. 介绍第一篇论文，中途打断，说不了解你们这个领域，针对强化学习的底层设计，怎么去设计的，强化学习能解决什么问题，强化学习每一轮用的数据是多少，模型用的多大的，用小模型做强化学习效果会好吗，实验室里有多少张卡，训练的时候都用了几张。\n3. 研究生阶段在做科研时遇到了什么困难，花费时间最长的是哪个阶段，研究生有什么成功的经验，没有有失败的经历，发现某条技术路线不行。\n4. 你认为未来会有什么新技术，还会有强化学习这种路线吗，agent调用工具时工具需要很多参数，幻觉现象很严重，未来可能会有什么解决方案\n\t\n四面\n1. 共享屏幕介绍论文，面试官听不懂，打开word讲述，问论文的创新点，输入输出是什么。\n2. 介绍第二篇论文。你的方法有泛化性吗，可以泛化到垂直领域吗\n3. 介绍第一段实习，问有什么经验，有哪些失败的尝试\n4. 介绍第二段实习，觉得我的介绍太平铺直叙了，说可以后面做个PPT\n\t\n四面面完hr跟我说通过了，但是推不上去了，估计再往上推就是高层面试了，可能是横向没比过其他候选人，或者是没去提前实习的原因。转成普通批还需要在北斗面试失败的候选人里进行横向[呃R]，或者直接终止北斗的面试从头开始面普通批（包括笔试）\n#互联网大厂实习 #互联网大厂 #面经 #算法 #秋招  #大模型 #校招 #人才计划","url":"https://www.xiaohongshu.c e reward 有什么问题\n10、长轨迹 agent 的 credit assignment 为什么难，一般怎么解决\n11、多轮工具调用哪些 token 参与 loss，tool response 为什么需要 mask\n12、reward hacking 有哪些表现，训练里怎么发现和处理\n13、reward 一直涨但 eval / benchmark 反而下降，可能是什么原因\n14、rollout 和训练阶段 logprob 不一致，可能是什么原因，有什么影响\n15、verl 的 dynamic batch size 是干什么的\n\t\n无手撕。\n\t\n最后反问了团队现在 Agentic 主要做什么、实习生一般负责什么，还有训练资源(训练100B左右的模型）\n#实习面经 #大模型 #算法 #后端开发 #面经 #互联网大厂","url":"https://www.xiaohongshu.com/explore/6a803ae00000000032031580","kw":"阿里面经"},{"title":"阿里星人才计划27届秋招提前批一面面经","author":"Zion","date":"编辑于 07-15","company":"阿里/Qwen","dirs":["Agent/自进化","NLP/通用"],"stages":["一面"],"city":"未注明","fit":true,"desc":"本来以为自己双非本+qs200硕过不了人才计划简历关的…\n结果居然拿到面试了\n本来约的7.2，还只能约到美西4:30/5:30am的时间，上一个闹钟好不容易爬起来，等了十几分钟面试官都没来，后来hr进会议室跟我说联系不上，给我换到7月5号了\n国内面试还是以八股为主\n和以前面的类型差不多，不过感觉面试官挖的会更深一点，面了一个半小时多，主要前一个小时是深挖我的简历，怼着我现在实习的项目狂问，把agent的架构从头到尾挖了一遍给了很多批判性的建议，也幸亏没问我早两年的水实习的经历，不然估计都答不上来。\n最后半个小时给我出了一道AI coding题目，让我写一个rag的chunk代码，感觉这里设计的有点缺陷，两年前在deloitte ai研究所实习的时候做过差不多的，但是稍微有点记不清了，而且当时设计的其实感觉就有点小缺陷\n给自己两个部分面试打8.5分+7分吧，如果是普通批面试应该能过，但是阿里星bar会高一些…两天没消息我估计是寄了\n\t\n后续确实挂了难受…\n#互联网大厂 #阿里巴巴 #bat #阿里星 #人才计划 #面经 #秋招 #提前批 #面试 #agent","url":"https://www.xiaohongshu.com/explore/6a4f2524000000000d00bc00","kw":"Agent面经"},{"title":"阿里秋招算法一面面经","author":"ohhhhh","date":"编辑于 2025-09-23","company":"阿里/Qwen","dirs":["后训练","RL强化学习","数据/评测","NLP/通用"],"stages":["一面"],"city":"未注明","fit":true,"desc":"#阿里 #阿里面经 #阿里秋招 #阿里算法\n八股\nsft训练数据规模和模型size的scaling law\n讲一下改进grpo的其他技术  dapo gspo\n如何解决 dpo grpo reward hacking的问题\ndpo grpo ppo区别\n全参微调和PEFT\n四种peft的模式addition replace lora prompt tuning\n\t\n手撕\n链表题 判断链表有无环 找链表相交节点\n时间复杂度On 找数组中第k个最大的数","url":"https://www.xiaohongshu.com/explore/68a49c04000000001d01751d","kw":"阿里面经"},{"title":"阿里面经淘宝闪购Agent运筹优化算法工程师","author":"孤飞","date":"05-01","company":"阿里/Qwen","dirs":["Agent/自进化","对齐","数据/评测","C++/工程"],"stages":["笔试","多轮"],"city":"未注明","fit":true,"desc":"自我介绍后直接进入项目深挖，无技术笔试，全程围绕 Agent 工程经验展开。\nQ1：你为何选用 OpenAI Agents SDK 而非开源框架？出于安全合规考量，开源方案是否更合适？\n核心考点是框架选型的 trade-off 认知。我说明了 SDK 在 tool 编排稳定性和工程成熟度上的优势，同时承认在企业生产环境中确实应优先评估开源/私有化部署方案，以满足数据不出域要求。面试官对\"我知道它的局限\"这个态度比较认可。\nQ2：你遇到过需要人工强制中断 Agent 执行的情况吗？如何处理 Human-in-the-Loop？\n介绍了关键 tool 执行前插入确认节点、置信度低于阈值时暂停并通知人工审核的方案。面试官追问是否在 .md 文件里写了强制停止条件——我说有在 instruction file 中定义 STOP_CONDITION，Agent 每轮 plan 阶段会读取校验。\n#互联网大厂 #面试题 #发面经攒人品","url":"https://www.xiaohongshu.com/explore/69f38a19000000003601ce89","kw":"阿里面经"},{"title":"｜阿里通义实验室面经｜","author":"我要做陪玩","date":"08-03 浙江","company":"阿里/Qwen","dirs":["RL强化学习","对齐","AI Infra","数据/评测","NLP/通用","C++/工程"],"stages":["多轮"],"city":"未注明","fit":true,"desc":"刚面完阿里通义实验室，整理硬核面试原题，主攻大模型方向，建议收藏！\n\t\n✅面试流程：自我介绍 + 项目深挖\n📝核心面试问题整理\n1️⃣ Qwen、LLaMA、DeepSeek模型结构对比\n三者均为Decoder-only Transformer，共用因果注意力、RMSNorm、SwiGLU、RoPE等基础组件。\nQwen2.5/Qwen3细节差异：\n▪️标准Pre-Norm结构\n▪️采用GQA，有效减少KV Cache占用，降低推理开销\n▪️QKV层带bias，和LLaMA形成明显区别\n▪️SwiGLU门控MLP，提升模型表征能力\n▪️Tokenizer对中文、代码、多语言适配更好\n\t\n2️⃣ 超长上下文方案，Qwen如何实现长文本\n长上下文两大痛点：训练位置外推难题、推理二次方复杂度显存压力\n🔹业界通用方案\nRoPE插值缩放（NTK、YaRN）、滑窗稀疏注意力、RAG检索增强、KV Cache各类优化、长文本续训\n🔹Qwen方案\nRoPE位置外推策略 + 长序列持续训练；搭配GQA、推理侧缓存优化；依靠长文档、代码数据增强长距离依赖能力\n\t\n3️⃣ MoE vs Dense，DeepSeekMoE优势在哪里\nMoE核心：总参数量大，但单次仅激活部分专家，算力利用率更高\n▫️MoE训练难点\n路由失衡、专家坍缩、跨卡通信开销大、负载均衡难，需要额外均衡损失约束\n▫️DeepSeekMoE亮点\n细粒度专家设计；通用共享专家+路由专家分离；完善路由均衡策略；配套成熟的分布式训练工程方案，非常值得参考\n\t\n💡个人小结\n整场面试偏重底座大模型基础，非常看重对主流开源模型(Qwen/DeepSeek/LLaMA)内部细节理解，不只背概念，会深挖结构差异。强化学习对齐、长上下文、MoE都是高频重点！\n\t\n标签：#大模型面试 #通义实验室 #阿里面经 #LLM面试 #算法岗面试题","url":"https://www.xiaohongshu.com/explore/6a70b2df00000000260379f0","kw":"大模型面经"},{"title":"26届的中石油中海油中石化秋招经验总结","author":"R.","date":"昨天 10:21 四川","company":"其他/未注明","dirs":["数据/评测"],"stages":["笔试"],"city":"未注明","fit":false,"desc":"我是26应届生，去年这三家秋招都参加了，后来也拿到了offer，下面跟大家总结分享下我去年备考的经验和时间线，希望可以给大家一个参考\n-\n时间线整理\n9月网申：中石油（9.15-10.21）、中石化（9.25-11.15）和中海油（9.21-10.30）都是9月开始网申，这个时间是去年的可以做个参考\n11月笔试：去年中石油和中海油是11.9，中石化是11.23，一般都是中石化晚一点\n11月面试：中石油面试一般11月就开始了，去年我是11月底面试的\n12月ai面+面试：中海油AI面去年是12月初，中石化面试也是在12月，12月中石油基本开始公示了\n1月：中石化公示，中海油看公司安排，它的流程很慢\n-\n中石油\n报名要求：26届未就业和27届应届生可以报考，英语要求本科四级硕士六级\n笔试：105题120分钟，其中思想素质30题，行测75题，思想素质包括企业文化和时事新闻，有单选和多选，行测部分只有单选，包括言语、判断、数量、资料和常识\n笔试考情：中石油笔试是线下统一机考，考试内容不算难，就是考试时间可能有点紧张，主要是行测板块的时间不够用，企业文化背背李千秋的三桶油校招笔试专题还有往年考的等就差不多了，进面的话需要80+有点难\n-\n中石化\n报名要求：只能27届应届生报考，竞争会稍微小一点但不多，本科英语要求四级，硕士要求六级\n笔试：100题120分钟，60行测和40道综合知识，综合就是企业文化和时事新闻，一般会考发展历程、企业使命等，行测的话考言语、判断、数量、资料，还有5道物理题\n笔试考情：中石化笔试也是线下统一机考，考试内容比较难，资料虽然就只有5道但是计算量很大，数据比较大不好算，而且资料还会有填空题很难，数量考的多也会有点难度，言语和判断的话就还好，进面需要70+\n-\n中海油\n报名要求：25届、26届未就业都可以报，还有27应届生，本科要求四级，硕士要求六级\n笔试：100道题120分钟，70行测和30综合知识，综合也是企业文化和时事新闻，行测考言语、数量、判断和资料\n笔试考情：中海油是线上单机位考试，考试内容比较简单，资料部分计算量可能会有点大，去年秋招的时候很难算，考试时间也比较充足，所以大家考的分数也很高，进面要80+\n\t\n#笔试备考#三桶油笔试#笔试经验分享#中石油#中石油#中海油#秋招","url":"https://www.xiaohongshu.com/explore/6a7fcd2a0000000025007a57","kw":"秋招经验"},{"title":"27秋招第一个面试邀请","author":"。。？","date":"编辑于 2天前 福建","company":"其他/未注明","dirs":["NLP/通用","C++/工程"],"stages":["多轮"],"city":"未注明","fit":false,"desc":"听说三轮面试都有手撕，已经做好被狠狠拷打的准备了\n面完了 1小时10分钟 我已力竭\n面试官人很nice 虽然问了很多工程化的问题我确实没有考虑到，但是也会引导我去思考\n手撕题现在回看其实不难，大概相当于leetcode中等难度，面试官引导之后我恍然大悟，但是到时间了。\n估计是挂了，但是经验+1，感觉学到了很多","url":"https://www.xiaohongshu.com/explore/6a7ad68c000000000600611b","kw":"秋招面经"},{"title":"27秋招进展以及经验总结","author":"天上的彤云","date":"07-17 美国","company":"其他/未注明","dirs":["NLP/通用"],"stages":[],"city":"未注明","fit":false,"desc":"秋招是场持久战，在此开源一些自己的经验，整理了一些问题，大家共勉。我搜广推和大模型都有涉猎，身边朋友做什么方向的都有，应该能够有一定的参考价值。有什么没讲到的，大家也可以评论区问我。\n\t\n一、个人bg\n\t\n二、暑期实习的重点是什么\n\t\n三、搜广推和LLM方向区别\n\t\n四、人才计划bar\n\t\n五、八股，力扣，项目，论文怎么准备\n\t\n六、高频面试coding考题\n#面经 #秋招 #大模型 #搜广推 #实习","url":"https://www.xiaohongshu.com/explore/6a5a406b000000001f01cfa7","kw":"面试总结"},{"title":"27算法面试还有还有手撕吗？","author":"卷卷的小笨","date":"07-24 广东","company":"其他/未注明","dirs":["NLP/通用"],"stages":[],"city":"未注明","fit":false,"desc":"面了两家，纯深挖项目实习，八股都少，无手撕\n\t\n大家现在面的都有手撕吗？还是说vibe coding多？","url":"https://www.xiaohongshu.com/explore/6a636c10000000001d00edc1","kw":"算法八股"},{"title":"KPMG毕马威新版双测评经验贴🔥(亲测版!","author":"Yoke","date":"编辑于 2小时前 广东","company":"其他/未注明","dirs":["多模态","AI Infra","数据/评测","C++/工程"],"stages":[],"city":"未注明","fit":false,"desc":"今年暑假实习申过KP，但是因为我投递太晚石沉大海…本来以为寒假实习不用做了，没想到8.10网申完照样发了全套测评！\n\t\n📱第一部分\n1️⃣英文口语情景题\n给员工满意度图表，口头分析数据差异、现存问题+落地改进方案\n审题的时候不用开摄像头，回答的时候要开\n\t\n2️⃣英文邮件写作\n写邮件找财务调取近三月销售数据，用来做季度报告\n这部分不开摄像头\n\t\n3️⃣中文AI视频问答\n系统会随机追着提问，居然这里没有自我介绍，有一些小问题可能有点忘记了，但是还是要好好熟悉自己简历，以下就是我记得的问题\n• 项目提前发现潜在风险，怎么处理化解\n• 学习/工作里特别挫败崩溃的经历，心路历程+补救行动\n• 举例和队友反复磨合协调，最后一起完成任务的完整过程\n• 跳出老套路，用新颖方法简化常规工作的案例\n\t\n💻第二部分\n总共30道，三类题型各10题\n文字逻辑｜图表计算｜图形推理\n\t\n个人感觉：出题套路跟德勤测评高度重合\n简单题时间会比较短，难题时间长一些，不会做的题目还是要先选一个答案，我就因为时间过了不能回去漏了一题，不会别死磕\n\t\n#四大审计 #毕马威 #毕马威测评 #毕马威寒假实习 #四大 #秋招 #财会#年审 #面经 #网申","url":"https://www.xiaohongshu.com/explore/6a809df00000000032033579","kw":"秋招面经"},{"title":"别再瞎训练大模型！LLM基座通用训练经验分享","author":"随机场","date":"05-11","company":"其他/未注明","dirs":["基座/预训练"],"stages":[],"city":"未注明","fit":false,"desc":"最近我刷到斯坦福cs 336的LLM架构课，有个结论：主流大模型拆开来比，90%的架构选择早就收敛了。随便去GitHub上看一个开源大模型，核心设计几乎一模一样。很多同学刚开始做大模型，为了避免在基础的架构上踩坑，总结了几个课上讲的经验，可以直接抄：\n\t\n👉超参数：4个直接抄的基准数字\n这些是大量实验验证的最优解，别自己瞎试：\n1. 头数×头维度≈隐藏层维度\n2. 模型纵横比（隐藏层÷层数）≈100\n3. 词表大小：多语通用模型100K-200K，单语30K\n4. 别随便关权重衰减，它帮优化器收敛到更优解\n\t\n👉 救命技巧：3招防止训练崩盘\n训大模型最怕loss飙升变NaN，这三招可以救命：\n1. 加Z-loss，避免softmax归一化项爆炸\n2. 加QK Norm，防止注意力数值溢出\n3. Logit soft cap，用tanh硬封顶，注意会损失少量性能\n\t\n#大模型 #人工智能 #模型训练 #基础模型 #基座模型 #训练经验 #斯坦福课程 #cs336","url":"https://www.xiaohongshu.com/explore/6a01b1350000000036001b4d","kw":"大模型学习路线"},{"title":"北大研一|转码经验贴","author":"考研电子宠物","date":"01-30","company":"其他/未注明","dirs":[],"stages":[],"city":"未注明","fit":false,"desc":"字太多放图里，主包转码也是摸着石头过河，希望能有所帮助～希望大伙都能体会转码的乐趣\n#转码","url":"https://www.xiaohongshu.com/explore/697c7eda000000000b00b684","kw":"大模型学习路线"},{"title":"去年跑了二十多家国企面试，彻底祛魅了。","author":"橘子🍊","date":"昨天 18:52 云南","company":"其他/未注明","dirs":["C++/工程"],"stages":["笔试"],"city":"未注明","fit":false,"desc":"1.我是普通二本毕业，实习也只是在一家不知名的企业呆了很短一段时间。去年秋招投递国企，蕞后顺利上岸市属国企综合岗位，去年跑二十多家的国企面试真的彻底祛魅了。其实蕞开始投出去的几十份简历全部石沉大海，直到后来慢慢调整思路和方法，才顺利拿到offer。下面就给大家分享一下自己的一些经验，希望可以帮助到大家。\n-\n2、别只知道投递热门岗位，可以优先选择小众国企。市属、区属国企的基层综合岗，还有粮储这类偏民生的功能型国企，这类岗位名气不大，但六险二金、年终福利都齐全，竞争压力比热门岗位小很多，上岸概率反而更高。\n-\n3、找招聘信息多渠道查找，别局限在综合招聘网站刷信息，很容易错过很多本地岗位，很多区县国企的秋招公告，只发在本地国资委官网、人社局招聘专栏，还有本地人社gzh上。另外不少国企会去本地高校开秋季专场宣讲，现场投递简历的通过率比网申高不少，外地求职者基本看不到这些机会。\n-\n4、简历别海投，每投一家都要对应调整内容。蕞好的做法就是每投一家，都先把招聘要求里的关键词提炼出来，之后对应到自己的经历里。比如投综合岗就重点写会务筹备、公文撰写的相关经验，投党务岗就把党建活动相关的经历放蕞前面，无关的兼职经历全部删掉，简历始终控制在一页。\n-\n5、网申别留空白项，有没填的很容易直接被筛掉。国企秋招网申大多先过系统初筛，漏填一项可能就直接被刷。所有能填的栏目都尽量填满，哪怕是校级的小奖励、课程实践项目，都按照做了什么、取得什么结果的逻辑写清楚。自我评价不用写空话，重点突出踏实稳定、愿意长期发展的特质，更容易被系统抓取到。\n-\n6、笔试抓核心考点高效准备。国企秋招的行测难度比公考低不少，把本地近三年的事业单位行测真题刷一遍，熟悉题型就足够。专业知识只看基础内容，不用钻研偏题难题。企业文化考前去官网翻一遍企业简介和近期的重点项目，临时记一下就能应付，不用花太多时间。\n-\n7、面试不需要背太多的模版，重点突出靠谱稳定。其实面试的时候被问得蕞多的，就是职业规划和稳定性的问题。不需要一直突出自己能力有多强，也别说太多宏大的职业目标，如实表达更看重国企的稳定平台，愿意从基层岗位做起，想在本地长期发展就好。\n#国企秋招#国企上岸#求职经验#应届生找工作","url":"https://www.xiaohongshu.com/explore/6a8044ef0000000033012530","kw":"秋招经验"},{"title":"双非护理硕士秋招找工作经验分享","author":"yaalin","date":"编辑于 昨天 17:35 浙江","company":"其他/未注明","dirs":[],"stages":[],"city":"未注明","fit":false,"desc":"写下一些自己的求职记录，希望给大家一些参考\n#护理研究生 #护理事业编 #护士找工作 #护士招聘 #护理考研 #护理#护士考编 #研究生","url":"https://www.xiaohongshu.com/explore/6a8020db000000002701f049","kw":"秋招经验"},{"title":"双非文科生秋招上岸国企的一点经验之谈","author":"岁寒","date":"昨天 17:13 云南","company":"其他/未注明","dirs":[],"stages":["多轮"],"city":"未注明","fit":false,"desc":"先自我介绍：\n我是去年的双非应届毕业生，文科生，有奖学金，但综合绩点就是班级中游，没参加过什么竞赛，在校期间也就参与过一些普通的班级、学生会打杂工作，简历写完之后才发现根本没啥亮点。秋招全程只投了国企岗位，目标很明确，就是求稳定、求安稳，当然蕞后也成功上岸了本地省属国企综合行政岗。我的上岸经历真的没有任何运气和捷径，全程都是自己踩坑、摸索、复盘、一点点练出来的，因为踩了太多坑，所以感觉对秋招各个环节大家可能会出现的问题应该都能说两句，这篇就是对自己整个秋招经历的梳理，应该会比较适合和我一样背景普通、没有核心优势的文科生参考。#国企#应届生#秋招#文科生","url":"https://www.xiaohongshu.com/explore/6a802d9c00000000240263d8","kw":"秋招经验"},{"title":"多模态面试问题小小总结","author":"三七","date":"05-31","company":"其他/未注明","dirs":["多模态","NLP/通用"],"stages":[],"city":"未注明","fit":false,"desc":"#多模态人工智能\n#面经\n主包最近面了几家多模态厂总结出来hr爱问的问题以及爱考手撕代码的知识点","url":"https://www.xiaohongshu.com/explore/6a1beb2f00000000370360e6","kw":"面试总结"},{"title":"应届生秋招上岸烟草，说说经验","author":"巧不巧","date":"昨天 11:51 海南","company":"其他/未注明","dirs":["AI Infra"],"stages":[],"city":"未注明","fit":false,"desc":"个人情况：2025届汉语言文学专业，无实习 / 学生干部经验，秋招投递多家国企，烟草、中石化进面，最后选择了离家比较近的烟草，分享我的经验，供大家参考～\n-\n信息了解：\n✨考试时间：海投了，有公告就投\n✨考试内容：公共基础知识+行测+写作\n✨形式：统一线下纸笔考\n-\n企业文化：\n提前去报考单位的g网或者跟着xwj的课程总结开始积累背诵\n烟草行业共同价值观：国家利益至上、消费者利益至上\n行业精神：爱岗敬业、诚实守信、办事公道、服务群众、奉献社会\n行业愿景：责任烟草、诚信烟草、和谐烟草\n行业使命：报效国家、回报社会、成就员工\n行业作风：严格规范、富有效率、充满活力\n核心价值观：责任、诚信、务实、创新\n主要业务：烟草专卖管理、烟叶生产经营、卷烟y销、物流配送等\n-\n行测技巧：\n➡言语：\n①相信直觉，相信固定搭配\n②留意与填词呼应的词、短语\n③逻辑填空从空白后边和下一个空白前面去找\n④逻辑填空一般语气是中等不会有很强烈的词，除非感情色彩很消极\n⑤片段阅读答案一般在首句或尾句，选项要选积极向上的，文中原话不选\n-\n➡资料分析\n①选项都是文字，选 C，选项都是数字，选 B\n②最后一道分析蒙 C 或 D\n-\n➡判断推理：\n①定义判断，如果多定义，没提问的定义排除\n②结论推理答案语气较弱，评价推理答案兼顾双方\n③图推变化不大的考虑对称、旋转、平移、翻转，变化大的考虑叠加、元素数量\n-\n➡数量关系：\n①三偶数一奇数，选奇数，相反选偶数\n②选项是区间，选中间两个区间\n③极值，问最大一般选第二大，问最小一般选第二小\n④选项里有整百整千的，先代入，多是正确选项\n⑤多利用选项，倍数等关系，不能每道都算，时间不够\n⑥ABCD 分布均匀，不会的蒙没选过的\n#27烟草 #秋招上岸 #应届生 #烟草考试 #经验分享 #烟草专卖局","url":"https://www.xiaohongshu.com/explore/6a7fe25a000000002500c377","kw":"秋招经验"},{"title":"秋招血泪经验踩坑总结‼️刷到都去对照改","author":"一只吐槽萱","date":"昨天 16:45 上海","company":"其他/未注明","dirs":[],"stages":[],"city":"未注明","fit":false,"desc":"#秋招面试 #应届生求职 #应届生简历 #求职避雷 #找工作避雷 #求职避坑 #校招面试 #0offer #面试辅导 #面试求职","url":"https://www.xiaohongshu.com/explore/6a80273d000000002c00130f","kw":"秋招经验"},{"title":"长江存储面经","author":"i purple V","date":"2天前 北京","company":"其他/未注明","dirs":[],"stages":["一面","二面"],"city":"未注明","fit":false,"desc":"#面经\n7月21一面\n围绕项目问答，大概30分钟\n没学过半导体物理，面试官考了我一个短沟道效应\n8月6号二面\n非常细致，主要围绕项目中涉及到的SPICE提问，面试官很专业。会有一些我没有听过的词汇，听不懂她会详细的解释一些，很耐心，大概45分钟\n8月13号看状态变了，但是没有打电话通知这一环节\n秋招第一面！希望能有好结果","url":"https://www.xiaohongshu.com/explore/6a7db650000000002701c9ac","kw":"秋招面经"},{"title":"26秋招大厂手撕算法汇总（不完全版）","author":"三角晗数","date":"2025-09-09","company":"大厂泛","dirs":["NLP/通用"],"stages":[],"city":"未注明","fit":false,"desc":"能不能给我一个offer 5555\n谁给我一个嫡长oc将获得我的特别优待\n#面经 #26秋招 #互联网大厂","url":"https://www.xiaohongshu.com/explore/68c0299d000000001d01e7a3","kw":"大厂面经"},{"title":"Transformer八股总结","author":"卷毛奶黄包","date":"03-11","company":"大厂泛","dirs":["NLP/通用"],"stages":[],"city":"未注明","fit":false,"desc":"一些常见问题，按照模块分了一下类，后续如果有补充会直接在这个笔记编辑，有需要的可以收藏～\n#计算机实习 #互联网大厂 #八股 #算法八股 #27届暑期实习","url":"https://www.xiaohongshu.com/explore/69b16366000000001d0268ab","kw":"算法八股"},{"title":"【面经分享】秋招大模型算法八股准备（2）","author":"AIvsAI","date":"编辑于 07-12","company":"大厂泛","dirs":["NLP/通用"],"stages":[],"city":"未注明","fit":false,"desc":"bg：211本+985硕，2段大厂实习，拿下BAT大满贯 SSP offer\n第二篇来咯\n再分享下我准备八股不死记硬背的技巧之一：先“读薄”，再“读厚”\n\t\n读薄就是提取关键知识点，比如你看的八股文里详细介绍了某个知识点，你能用不到20个字把它概括出来吗？比如看FlashAttention的原理，不要背长篇大论，提炼成：“分块计算，减少HBM读写，用SRAM加速”\n现在的问题是关键词有了，但是面试的时候得自己用语言表达完整，不能只蹦出几个词。\n所以读厚我这边定义为：\n用自己的话扩充表述完整这些关键词。\n所以不要背书，把提炼的关键词，用自己理解的语言扩充成完整的句子。\n知识点之间建立联系，点成面（这个学习任何知识都一样）\n面试官最喜欢顺着你的回答往下追问，你在准备一个点的时候，就要主动建立联想。比如准备“GQA”，你要顺带想到：\n它是为了解决什么问题？（KV Cache太大）\n它的前身是什么？（MQA，但掉点严重）\n它的折中方案是啥？（分组共享KV） 这样点连成面，无论面试官从哪个角度挖坑，你都能填上。\n牛客面经不断扩充自己的知识面\n看看别人被问了什么刁钻的角度？同一个知识点，面试官的追问点在哪？用真实面经不断去冲击你的知识网络，把漏掉的地方补上，不断扩充自己的知识面。\n\t\n💡 总结一下： 读薄是为了记住，读厚是为了说出来。 大家在准备八股的时候，尽量做到平时多联想，面试能瞎扯\n\t\n#大模型 #算法 #面经 #大模型八股 #秋招准备 #实习 #面试经验 #秋招 #面试技巧#大厂","url":"https://www.xiaohongshu.com/explore/6a525736000000001503f161","kw":"算法八股"},{"title":"八股文真不重要，真的","author":"波哥聊求职","date":"2025-10-27","company":"大厂泛","dirs":["NLP/通用","C++/工程"],"stages":[],"city":"未注明","fit":false,"desc":"可能是面试中优先级最低的事了\n如果面试中被问了大量不熟悉的八股文，先看下自己的简历有没有问题\n\t\n#算法工程师 #互联网大厂 #算法 #大模型 #八股文","url":"https://www.xiaohongshu.com/explore/68feb4050000000003034fd5","kw":"算法八股"},{"title":"小小怪秋招八股：互联网面试智力题","author":"算法小小怪下士","date":"编辑于 03-31","company":"大厂泛","dirs":["NLP/通用"],"stages":["笔试"],"city":"未注明","fit":false,"desc":"针对这个八股专题，我感觉实在是写的时候良心不安，有点hacking现在互联网的面试体系的意思。一年前的我做过这个智力题的纸质版笔记，现在还是电子化分享给正在准备面试的朋友吧，顺便以慰去年找暑期的时候略焦虑的自己吧，并纪念我去年快乐的夏天。\n\t\n小小怪近期预计更新3-5篇秋招八股。\n准备日常/暑期/秋招的朋友们可以关注下哈。\n学习资料会release到github上\n#算法岗 #实习 #互联网大厂实习 #秋招笔试 #智力题","url":"https://www.xiaohongshu.com/explore/69cb63bd000000001a02c882","kw":"算法面经"},{"title":"本人被大厂拷打30+次后的面试小tips！","author":"上班就困怎么办","date":"编辑于 3天前 北京","company":"大厂泛","dirs":[],"stages":[],"city":"未注明","fit":false,"desc":"复盘了一下过去一年的秋招和春招，这篇文章主要是针对大模型方向（开发算法通用），觉得自己面试回答比较普通，没有亮点，不够深度的一期技巧分享～\n[心花烂漫unlock]概述:\n1.引导面试官，而不是被引导\n2.学会延伸问题和答案\n3.本质上回答问题\n（详细的见图片）\n\t\n[心花烂漫unlock]非常好用的小tips！！！！\n1.如何让你的回答更可信： 给两个回答 –其中一个好 --心理上 他的判断不是 你的回答靠不靠谱 而是 这两个哪个好 为什 么？ 思维分散了\n\t\n2.适当总结他的问题：有时候面试官也有问题比较啰嗦的时候？ 你回答前适当总结 根源上解释这个 问题\n\t\n3.适当看看前沿论文 和技术报告 ，用于吹牛用。 例：不知道您看没看过......（大概率没 看过）\n\t\n[心花烂漫unlock]下一篇分享简历项目怎么选，如何优化和串联，全个人经验总结，终于杀进大厂了，感兴趣的小伙伴可以关注一下～\n#互联网大厂实习  #大模型 #互联网大厂 #面经 #面试技巧 #秋招 #经验 #校招 #waic2026","url":"https://www.xiaohongshu.com/explore/6a5ca2e6000000000100d4dd","kw":"大模型面经"},{"title":"面试实录，开源我拿大厂人才计划大满贯ppt","author":"丁霄汉","date":"编辑于 2025-09-29","company":"大厂泛","dirs":[],"stages":["多轮"],"city":"未注明","fit":false,"desc":"开源一下我拿了各种校招人才计划的ppt。正如我在之前的几个帖子里说的，作为有一定成果产出的毕业生，校招面试的重点是讲出体系感、自信感、事业感，而不是像组会讲论文一样挨个讲自己的论文，每一篇都从背景讲到结论。\n\t\n这份ppt我用在2021年9月到11月的校招面试里，面了很多公司，总共复读了四五十遍。\n\t\n面试时我有8篇正式发表的paper，引用400左右。\n\t\n我肯定不是2022届国内博士中条件最好的，也不是面试最好的，这份ppt仅供大家参考。\n\t\n在发的图里，黄底黑字的内容都是这次加进去的说明和注释，除此之外无任何改动，保证原汁原味。\n\t\n#人工智能 #大模型 #大厂 #面经 #面试技巧 #博士 #校招 #科研 #毕业 #秋招","url":"https://www.xiaohongshu.com/explore/68da8ef90000000012033ce4","kw":"大模型面经"},{"title":"26届字节筋斗云人才计划六面（HR面）面经","author":"Star Sky","date":"2025-10-15","company":"字节/即梦","dirs":["多模态"],"stages":["HR面","多轮"],"city":"未注明","fit":false,"desc":"此为筋斗云面经系列六篇的第六篇\n六面时间8.18：\n岗位偏成像光学，也包含一些算法；\n六面面试官为HR Leader，开视频，时间45min；\n\t\n这是我第一次HR面，面试前准备了一些常见问题：\n个人优缺点，\n职业规划，\n最有成就感的事，\n此前面试感受，\n企业文化，选择本公司的理由等。\n也了解了此前筋斗云的定级和薪资，准备自己的薪资方案。\n\t\n面试官首先自我介绍，也对岗位和待遇进行了一些介绍。\n我的自我介绍部分，预先准备了口头介绍和PPT介绍两种方案，实际面试官允许我用PPT介绍。我的PPT还是比较偏技术的，我讲的时候尽量比之前更通俗一些，面试官还是能比较好理解的。PPT讲完Introduction部分就不讲后面具体的部分了。\n然后是一些常规的问题，我准备的那几个问题都用上了；唯一有偏差的就是优缺点，我准备的是针对岗位需求的，实际问的是个人整体上的三个优点和三个缺点。\n然后问了一些其它情况，base地意愿，毕业预期，实习意愿，课题组情况什么的。\n问了预期薪资方案。\n反问环节，问了培养和晋升制度，和国外团队沟通便利度，落户，后续流程等。\n后续流程：说是先是有个全体面试官合议，然后走薪资和offer的审批流程。\n\t\n这次结束之后8.22通知通过面试流程，开始走后续审批流程。\n8.27那边找到我导师问我的意向，是不是认真想去[呃R]\n8.29电话沟通，口头oc，沟通薪资方案。\n9.5电话沟通打听其他家进展，然后说正式薪资方案要等10-11月；邮件oc。\n\t\n前序面试时间线及面经见主页。\n#26秋招 #字节跳动 #筋斗云人才计划  #光学秋招","url":"https://www.xiaohongshu.com/explore/68ef91a0000000000402015b","kw":"大厂面经"},{"title":"7轮面试拿下500一天的暑期实习offer！","author":"千里起解（秋招版）","date":"编辑于 01-27","company":"字节/即梦","dirs":["多模态","搜推"],"stages":["一面","二面","三面"],"city":"未注明","fit":false,"desc":"经过大半个月猛猛面字节，也是给主包混进宇宙厂了！没想到还没过年就找到了转正实习，接下来再面试应该就是秋招了。\n下面是timeline和主包投递字节的一些经验。\n\t\n整体面试时间线如下：\nAML–筋斗云–广告大模型\n1.7一面（面完1h电话约二面）\n1.9二面（面完1h电话通知已挂，可转AML其他组继续面，拒绝）\n抖音短剧–推荐算法\n1.14一面（面完1h约二面）\n1.15二面（面完当晚约三面）\n1.16三面（面完push一次，回复还在评估中，两天后通知需求不匹配，挂）\ntiktok短视频–推荐算法\n1.21一面（面完1h约二面）\n1.23二面（面完push多次，回复业务老师太忙了，还没来得及提交结果，两天后通知oc）\n\t\n整体面试体验下来，字节的HR小姐姐们都非常负责，因为主包比较想去核心一点的组，所以这次找实习更多的时间和精力是花费在找核心组的HR和业务上了，面试反而没花多少时间。\n一年前零基础转码的时候也面过字节，当时面完感觉字节是一道不可逾越的高峰[泪崩R]\n如今因为主包是第四段实习了，所以感觉基本还算轻松，很少会一面挂（面对什么业务都能扯上两句hh），一般最后挂了也不是能力问题，只是确实与组里的需求不太匹配，不过面试本来也是一种双向选择。\n\t\n下面是一些投递字节的一些经验：\n建议不要在官网上投递岗位，因为字节架构太大了，官网上会有一堆名字和jd都一样的岗位，但是实际上却是大部门下完全不同的业务组。\n如果想去核心业务或者核心组，建议在xhs或者boss上找到对应的hr或者业务老师（如果实在找不到也可以让别的hr帮忙推一下，字节的hr都比较热心），然后跟HR说清楚具体想面的业务组，让HR帮忙把简历给业务老师评估。\n虽然字节可以无限复活，但是建议提前找备选业务组。因为当前流程结束的话，简历有可能会被其他你不想面的组捞起，然后就会比较麻烦。所以可以提前联系下一个组的HR，当前流程结束后立马帮忙锁简历。\n因为字节是有面评的，所以建议按核心程度往下依次投递面试（不确定比如你面一个普通的业务组挂了，核心组还会不会约面）\n\t\n祝大家暑期实习面试顺利，早日拿到offer！\n（暑期实习部分面经之前已经发布，剩余的后续会陆续发布，欢迎关注主包）\n#互联网大厂 #大模型 #互联网大厂实习 #人生第一个offer #面经 #字节跳动 #推荐算法 #27暑期实习 #27秋招","url":"https://www.xiaohongshu.com/explore/69776f990000000021030844","kw":"算法面经"},{"title":"博0字节seed实习二面面经（已通过）","author":"卡夫卡的熊","date":"04-14","company":"字节/即梦","dirs":[],"stages":["二面","三面"],"city":"未注明","fit":false,"desc":"二面也主要拷打项目。\n\t\n问了些项目中的训练方面的细节，有没有接触过stf，RL训练等等。\n\t\n还问了个场景题：如果让你去训练Doubao的专业输出能力，会怎么做\n\t\n最后没有考代码。周五面试，今天发三面通知\n#互联网大厂 #互联网大厂实习 #令人想笑的offer #面经 #面试 #面试日常 #大厂 #令人心动的实习日记","url":"https://www.xiaohongshu.com/explore/69ddbb4c0000000021005e3b","kw":"字节面经"},{"title":"大模型面经分享11｜27秋招","author":"面试喵","date":"1天前 上海","company":"字节/即梦","dirs":["多模态"],"stages":["一面","技术面","多轮"],"city":"未注明","fit":false,"desc":"1. 快手多模态大模型一面\n2. 百度多模态大模型一面\n3. 新浪多模态大模型三轮技术面\n4. 文心一言多模态大模型实习而眠\n5. 科大讯飞26校招多模态大模型\n6. 海康多模态算法\n\t\n#算法 #大厂 #面经 #大模型面试 #大厂算法 #秋招 #互联网大厂 #字节跳动 #算法实习 #大模型学习","url":"https://www.xiaohongshu.com/explore/6a7ed9300000000032023887","kw":"大模型面经"},{"title":"字节 秋招 筋斗云人才计划 面经 时间轴","author":"Carton","date":"07-13","company":"字节/即梦","dirs":["搜推","NLP/通用","ML基础"],"stages":["一面","二面","三面"],"city":"未注明","fit":false,"desc":"7月了，最近会发一些我去年秋招的面经，大家加油！\n\t\n一面7.16\n* 自我介绍：讲脉络图（还不知道脉络图是什么的同学看我主页笔记）\n* 纯聊项目。针对项目问得很细，并且会问一些挑战性的问题。比如“这个东西很直觉，为什么到你才开始用？这个方法是否在其他场景也有使用，是你完全原创的吗？这个工作未来你想怎么改进？”\n* 代码：求ln(x)。我说牛顿法(泰勒展开)，提醒我可以用二分法更简单。二分写完以后，最后还试了下梯度下降法。\n\t\n二面7.22\n* 自我介绍：讲脉络图\n* 聊项目，没问太难的问题\n* 因为面的是推荐所以问了八股：正则化的目的是什么，答稀疏化可以服务于线上，之后追问为什么稀疏化对线上有好处？又问了除了稀疏化以外还有什么好处，答避免过拟合。总之会一直深入问下去。还让讲讲优化器（动量，Adam，AdamW）\n* 代码：完全背包问题，但要求恰好装满\n\t\n三面7.29\n* 自我介绍：讲脉络图\n* 代码：写注意力（面试官很高效，我觉得我写的时候她就在想项目问啥）\n* 继续问项目，LLM相关的挨个介绍\n* 你之前的经历是内容理解相关的，现在来投推荐，为什么？\n\t\n后续：\n不算很对口，因为我没做过推荐。面试在校招里评价很高，但给不到筋斗云。对推荐只有基础知识了解和OneRec类生成式推荐，hr说面评是好的，可以帮我直接转内容理解岗位。\n我感觉综合看下来就是没做过推荐，所以给不到筋斗云，果断换下一个组（面经在另一个笔记）\n\t\n更多经验分享，点点关㊗️都能找到哦\n\t\n#互联网大厂 #面经 #校招 #求职 #斩获offer的秘诀","url":"https://www.xiaohongshu.com/explore/6a53bc0b000000001702c5ef","kw":"字节面经"},{"title":"字节法务实习面经","author":"Ember Thaw","date":"编辑于 03-28","company":"字节/即梦","dirs":[],"stages":[],"city":"未注明","fit":false,"desc":"流程：投递➡️第二天收到面试邀请➡️收到邀请后隔一天面试\n\t\n面试问题：\n1⃣️自我介绍\n2⃣️实习经历中印象深刻的工作\n3⃣️诉讼经历中印象深刻的事件；负责的工作内容；遇到的困难；如何解决\n4⃣️对互联网行业/电商领域有什么了解（包括法律层面和非法律层面）\n5⃣️对岗位工作职责的理解\n6⃣️如何看待和应对法务实习中的基础性工作\n7⃣️结合生活经验、法律视角、平台视角谈谈对“仅退款”规则的理解\n8⃣️反问\n\t\n总结：\n不同组别可能面试侧重点不同，仅供参考。但基本对面试的准备大同小异，不仅需要熟悉自身简历（部分问题偏向于宝洁八大问类型），同时也需要根据面试对应组别了解相关行业背景知识以及常见法律问题（会倾向于询问当下比较热点或前沿的法律问题）。后来面试过字节其他非法学岗位，也发现面试官同样倾向于结合当下热点问题判断个人的专业素养、分析能力和对行业整体的了解程度，所以面试前一定要提前去结合行业背景和当下热点问题进行准备。\n\t\n补充：关于投递时间节点的选择\n去年3月也投递过但一直没有回音，这次应该是正好遇到缺人的时候投递流程推进非常快。\n结合我投递其他实习的体感：\n1⃣️如果有内推是最好的（能够快速了解到岗位上一任同学什么时候离职而及时投递）；\n2⃣️但大多数情况都是和我一样没有内推不了解岗位现状的，投递时最好选择类似于寒暑假临近结束前（可能大部分同学需要结束实习返回学校上课），同时自己能立即到岗且到岗天数较多的时间（一般都是急招，需要随招随到）；\n3⃣️不确保在上述时间节点投递一定能成功，更多还是看运气。。有时候如果没有收到面试并不是自己的问题，而是正好不凑巧没有遇到缺人的时候，不要因此怀疑自我的bg和能力；\n4⃣️相比起异地实习，本地同学会更有优势；相比起短期实习+每周不能全勤，长期实习+每周全勤更有优势。\n\t\n#互联网大厂实习 #字节法务 #字节法务实习","url":"https://www.xiaohongshu.com/explore/69c6abb5000000001a025671","kw":"面试总结"},{"title":"字节飞书大模型算法面经","author":"汤圆脑袋","date":"编辑于 05-09","company":"字节/即梦","dirs":[],"stages":[],"city":"未注明","fit":false,"desc":"","url":"https://www.xiaohongshu.com/explore/69fed8db000000002003bfcb","kw":"大模型面经"},{"title":"秋招之不知道还会挂几次的字节算法一面","author":"迟闻水","date":"2025-09-11","company":"字节/即梦","dirs":[],"stages":["一面"],"city":"未注明","fit":false,"desc":"字节每次都是疯狂拷打 必须对项目特别熟悉才行 而且代码没有一次是hot100\n就这样吧 不许愿了 许了也没用","url":"https://www.xiaohongshu.com/explore/68c27fa9000000001d001d28","kw":"字节面经"},{"title":"近期推荐算法秋招面经&凉经","author":"szc","date":"昨天 10:49 北京","company":"字节/即梦","dirs":["搜推","ML基础"],"stages":["一面"],"city":"未注明","fit":false,"desc":"主要是kstar，米哈游，字节三个，感觉米哈游算是问的最难的，一面就挂了#面试经验howto #面经 #找实习 #求助offer选择 #深度学习","url":"https://www.xiaohongshu.com/explore/6a7fd3d1000000002c0016a2","kw":"算法面经"},{"title":"27博士秋招记录 1","author":"imagine","date":"编辑于 4天前 广东","company":"小米","dirs":[],"stages":["一面"],"city":"未注明","fit":false,"desc":"小米顶尖应届一面 2026.08.10\n感觉面试官还挺nice，聊得挺放松，不知道还有没有下一面","url":"https://www.xiaohongshu.com/explore/6a7b2918000000002c005948","kw":"秋招面经"},{"title":"小米顶尖应届一面结束","author":"BU想学习","date":"编辑于 06-25","company":"小米","dirs":["NLP/通用"],"stages":["一面","多轮"],"city":"未注明","fit":false,"desc":"面试官很友好，实力也很强，面试过程学习到了很多。\n是一次非常不错面试体验。\n大概1小时35分钟，全程拷打项目，无手撕\n#秋招 #面经 #秋招提前批","url":"https://www.xiaohongshu.com/explore/6a3b90080000000011012fa9","kw":"面试总结"},{"title":"27届秋招经验分享——🙅过度焦虑","author":"糕手深藏Blue","date":"昨天 23:52 北京","company":"小红书","dirs":["NLP/通用"],"stages":["多轮"],"city":"未注明","fit":false,"desc":"不知道大家有没有这样的感受 红薯上很多散播焦虑的贴子，（可以关注➕我 我给你分享信息差！）总的来说 焦虑的原因就两条：想同时做很多事情，又想立即看到结果。焦虑是天性，我们没有必要自责，而应想办法看清背后的机理并设法改变。提升能力，保持耐心，静待花开。\n1️⃣秋招本质上是人才储备，很看重学历‼️ 明年七月份入职，愿意培养你。普遍面试流程周期很长，没实习对学历高的人影响不算大（基本无缘top厂）但会影响约面率和横向对比（学历一个档次 就会看面评、实习 对口实习加分）\n2️⃣注意投递时间 严格 层层按学历划分！！！秋招确实是双9 9硕的天下，对于普通院校的双非本、双非硕 10月起步 没准备好的甚至可以战略性放弃秋招 转投title厂实习，春招（急需用人）的性价比高于秋招。注意：实习优先级zui高的是title。\n3️⃣时间紧急 任务重：现在八月份已经进入到秋招冲刺阶段了，性价比‼️的方案是面向简历学习，面向面试官学习。切记must熟悉简历上的每项内容，可以找个水平差不多的朋友 互相拷打，输出是zui好的输入。\n4️⃣关于面试：如果你学历高 可以先找一些不想去的公司 以面代练，总结复盘。面试要学会吹水，讲故事，站在面试官的角度思考，而不是罗列技术，比如从场景出发，方案选型对比，遇到的问题如何定位解决的，项目风险如何评估的，性能优化怎么做的，解决了客户什么痛点 等等方面，那对于基础八股来说：高频的可以讲得更有深度 结合项目来讲 我遇上问我进程间通信 我会把冰羚（博世研究的中间件）拿出来只要不喊停我能讲五分钟，对面试官也要祛魅都是ctbz。\n5️⃣岗位选择：社会需要的 自己擅长的 喜欢的 三者取交集。多提高自己的认知，对就业市场的了解，处处都有信息差吧。比如大厂有些对你来说没那么起眼的岗位  比如某职能岗：21*15➕3w签字费。学历2本起步➕面试能力 如果总觉得自己不行，那你又能成什么事呢。\n祝大家一切顺利吧！\n#小红书校招 #秋招 #斩获offer的秘诀 #大学生毕业找工作 #校招","url":"https://www.xiaohongshu.com/explore/6a808b2c00000000320309d3","kw":"秋招经验"},{"title":"AIDU 人才计划一面","author":"小鸡毛（备战秋招版）","date":"2天前 北京","company":"百度","dirs":["NLP/通用"],"stages":["一面","多轮"],"city":"未注明","fit":false,"desc":"提前让准备一个文档 or PPT，全程讲简历，问细节，零八股。手撕数学题。全程一个小时，轻松愉快😊\n感觉是不是对我不太感兴趣😑\n#互联网大厂 #百度 #AIDU","url":"https://www.xiaohongshu.com/explore/6a7d6d180000000006006fcc","kw":"阿里面经"},{"title":"wxg一面三个小时","author":"暹罗猫大王","date":"04-13","company":"腾讯","dirs":[],"stages":["一面"],"city":"未注明","fit":false,"desc":"四道力扣题\n一道海豹繁衍，一个堆排序，一个promise， 一个赋值调换\n然后就是疯狂问项目，事无巨细 ，各种角度问\n问了很多AI相关问题\n大概问到最后我退都已经坐麻了#腾讯面试","url":"https://www.xiaohongshu.com/explore/69dd0860000000001f00054a","kw":"腾讯面经"},{"title":"半吊子计算机女拿到offer的奇技淫巧","author":"Civetovo","date":"编辑于 1天前 广东","company":"腾讯","dirs":["AI Infra","数据/评测"],"stages":["技术面"],"city":"未注明","fit":false,"desc":"bg\n计算机女，技术很一般，LeetCode只刷了hot 100，项目除了课程设计就是一段小厂后端实习，没发过论文也没拿过国奖。找工作基本allin所有自己合适的岗位，最后拿了腾讯的offer。我最大的感受是：计算机女生的身份在面试中并不吃亏，技术不够也可以靠表达和准备补上来。\n-\n简历经验\n基本信息：姓名、出生年月、电话、邮箱、学历，这几项足够，照片不用放，占地方。\n教育背景：学校好就放最前，硬通货能过机器筛选。\n技术栈：别写熟悉、精通，写使用过加落地场景。比如用Spring Boot+MyBatis做过日均2万请求的项目。\n.\n个人经历:这部分应该是大家最头疼的板块，我是用STAR法则包装\n-背景：小厂实习做教育SaaS后端，负责用户登录态模块。\n-任务：设计QPS 500+的刷新方案。\n-行动：用Redis存分布式session，配JWT双token；压测后CPU飙高，加本地缓存二级兜底，调整过期策略，响应从120ms优化到45ms。\n-结果：上线稳定运行，mentor评价主动性强，代码质量高。每段经历我准备两个完整案例，包括踩过的坑，讲到脱口而出。\n-\n没约面试？改策略，别摆烂\n改简历：把JD关键词精准嵌进去，投后端就突出高并发、缓存、消息队列，别一份简历投所有方向。\n换目标：别死磕算法和基础架构，业务后端、测试开发、客户端开发这些方向门槛友好，薪资也不差。\n补技能：没面试就刷hot100，每天三题，同时吃透项目每一行代码，保证被问到底层原理时能接住话。\n-\n面试怎么表达\n①项目用STAR串，我习惯回答问题先抛结论，比如这个接口慢是因为数据库查询没走索引，再展开优化过程。面试官追问细节是常态，简历上每个数字都要能说清测量方式。我被问45ms怎么测的，直接说用JMeter压测取平均值，对比优化前后，对方就满意了。\n②技术面必考场景题和方案选型。提前想好流量翻十倍会先挂在哪、怎么改。腾讯面时问为什么不全部用Redis而要用本地缓存，我从数据一致性、网络开销、成本三个角度分析，面试官当场点头。\n③谈薪别报太低，不要因为是女生就心虚。去offershow上看清楚校招批发价，按中上位置报，留出谈判空间。\n#计算机 #求职 #应届生 #找工作 #IT #理工科 #腾讯","url":"https://www.xiaohongshu.com/explore/6a7ecf5d00000000250049c1","kw":"腾讯面经"},{"title":"混元青云计划面经","author":"ping","date":"编辑于 04-12","company":"腾讯","dirs":["多模态","AI Infra","NLP/通用"],"stages":["一面","多轮"],"city":"未注明","fit":false,"desc":"- 3.13 电话约面\n- 3.18 一面\n面试官说在工位不方便开摄像头，提醒我也可以不开。（想起了大三去鹅实习的时候，一面的 mentor 也是这样和我说的hhhhh，鹅的面试官培训环节有这样的要求，太尊重人了[抽泣R]）\n\t\n全程聊简历实习做的事，穿插一些对应的推理知识，0 八股\n\t\n手撕：可选 CUDA 或算法题，选了算法题，给了一个 easy dp\n\t\n结尾反馈表现不错，耐心介绍了会做的事，推理框架、算子开发、推理算法\n\t\n- 3.20 状态通过\n- 3.23 无推进，流程结束\n\t\n虽然挂了，总体来说面试体验很好，面试官非常礼貌耐心。\n\t\n后续被 IEG 游戏运营开发、TEG云架平、微信视频号后台开发捞过，只想做 LLM 所以全拒了，鹅约面真的不咋沟通啊，直接就是会议邀请邮件发过来，都不太清楚岗位内容\n\t\n#青云计划 #人才计划 #27届实习 #LLM","url":"https://www.xiaohongshu.com/explore/69db8f4d000000002200fe8f","kw":"腾讯面经"},{"title":"腾讯混元基模组青云实习面经","author":"Oooooo","date":"编辑于 04-28","company":"腾讯","dirs":["基座/预训练","多模态","NLP/通用"],"stages":["一面","二面","三面","四面","HR面","技术面"],"city":"未注明","fit":false,"desc":"记录一下腾讯混元青云实习面试，多模态生成方向，面试进度较慢，强度较大，平均一周一面，3月27日投递。\n初试一面4月8日，面试时长1小时20分钟，流程包括ppt自我介绍，问项目，问八股，手撕vae训练loss。\n复试二面4月15日，面试时长1小时40分钟，流程包括ppt自我介绍，问项目，问八股，手撕bucket sampler。\n复试三面4月22日，面试时长1小时20分钟，流程包括ppt自我介绍，深度考察项目，无八股无coding。\nHR面四面4月27日，面试时长30分钟，主要问简历上的实习和未来规划发展，谈薪后未a，拿了个白菜价青云。\n技术面面经图3自取，只记得一部分，主要聚焦生成方向问的比较细比较深。\n#大厂实习 #暑期实习 #人才计划 #混元 #腾讯 #多模态大模型 #27届实习 #计算机专业 #面经 #视频生成","url":"https://www.xiaohongshu.com/explore/69ea1807000000002301466f","kw":"算法面经"},{"title":"腾讯青云四面被秒挂了","author":"千层面教授","date":"编辑于 2025-08-27","company":"腾讯","dirs":["NLP/通用"],"stages":["一面","二面","三面","四面","主管面"],"city":"未注明","fit":false,"desc":"7.31 一面：面试官是一个不开摄像头的老哥，听起来很nice。非常健谈，总是不知不觉岔开话题开始闲聊。主要就是讲项目，中间穿插对他们业务的关联和提问。最后写代码leetcode medium题3分钟写完了。一共面了90分钟。\n\t\n8.6 二面：也是讲解项目，问了很多业务上的问题，对项目的思考。没有考八股和代码，也是聊天。面了60分钟，然后说要面下一个了就结束了。\n\t\n8.9 三面：主管面，面了40分钟不到。没怎么问项目，问了一些宏观上的问题，比如你觉得你phd的最大贡献是什么。又聊了一下部门的业务。\n\t\n8.20 横向等了很久终于约上了，应该是比三面更大一级的领导，聊了70分钟，内容和三面差不多，聊得也还行。\n\t\n8.22 过了一天多收到通知挂了。一脸懵逼。\n\t\n﻿#校招﻿ ﻿#科研﻿ ﻿#互联网大厂﻿ ﻿#职场人生存法则﻿ ﻿#没想到你是这样的程序员﻿ ﻿#腾讯﻿ ﻿#青云计划","url":"https://www.xiaohongshu.com/explore/68935a7f000000002302c7f8","kw":"腾讯面经"},{"title":"腾讯青云计划面经","author":"梵梵p30","date":"06-18","company":"腾讯","dirs":["NLP/通用"],"stages":["一面","二面","三面","四面","技术面","多轮"],"city":"未注明","fit":false,"desc":"后台问的人太多了，还是写写吧。但是我觉得对绝大多数人，【此面经没有帮助】。\n想面试流程总体来说就四轮，两轮技术面，一轮用人决策，一轮高级hrbp。\n技术面一面二面都是讲PPT，会根据ppt已做的工作进行一些发散提问，但是不会脱离你做的工作来问八股。\n然后对于未来工作会进行一些基于我ppt的一些探讨和可行性的讨论（真的是讨论，不是拷打。）\n以上是一面内容。\n\t\n二面就是纯讲PPT了，没有太多发散和讨论，结束得比较早。\n\t\n然后三面就是过了一下简历，然后聊了聊未来规划，实习地点和实习时长以及老师放不放实习的问题。\n\t\n四面就是青云hrpb 谈薪。四面不方便透露更多内容，熟人也请勿微信问我哈。\n\t\n全程无八股无手撕~\n\t\n真的就只有这些了，再多也没有了~\n\t\n#面经 #腾讯青云计划 #实习面经","url":"https://www.xiaohongshu.com/explore/6a33c5b5000000001603f5ee","kw":"腾讯面经"},{"title":"腾讯面经Ⅰ项目管理PMO（已offer）","author":"耶yeyeyeye（双赛道上岸版）","date":"3天前 北京","company":"腾讯","dirs":[],"stages":["一面","二面","HR面"],"city":"未注明","fit":false,"desc":"timeline（2025年）\n一面：8.4\n二面：8.6\nHR面：8.14\nOC：8.20\n\t\n每一面30min左右，具体问题见p2-p4\n一面面经：\n1. 自我介绍\n2. 介绍产品实习A项目\n3. 在产品实习中，主要工作内容是什么？\n4. 对于需求的管理，如何评估优先级？\n5. 面对需求变更，一般是如何管理或控制的？\n6. 在产品迭代过程中，如何处理外部需求？\n7. 介绍战略实习B项目\n8. 通过什么方式发现了AI在XX场景下的需求点？\n9. 未来职业规划\n\t\n投递的是产品岗，但很快先被项目管理岗捞起来了，由于刚开始秋招，秉持着来都来了不如积累经验的想法便开始面试了。面试更加聚焦如何去管理需求，最好能有case去进行支撑，同时也在不断试探我的求职意愿，总体来说难度不大。不过该岗位并不直接发放正式校招offer，而是需要先行实习，2-3个月后再转正。由于不想因为实习耽误校招，且岗位也不是目标方向，所以很快就拒了。\n\t\n#互联网大厂 #校招 #面经 #项目经理 #腾讯","url":"https://www.xiaohongshu.com/explore/6a7bd48d00000000320200a1","kw":"秋招面经"},{"title":"苯人近期高强度面试总结出的一些tips","author":"伟大的小黄鸭","date":"04-07","company":"腾讯","dirs":["NLP/通用"],"stages":[],"city":"未注明","fit":false,"desc":"1⃣️ 在自我介绍时，把最有把握的项目和成果抛出来，同时埋一些钩子引导面试官提问。（例如：介绍核心项目时，提一嘴在推进某举措时遇到了一定困难，但不展开讲，引导面试官提问具体是什么困难以及如何解决…百试百灵！\n\t\n2⃣️ 回答任何问题都要强迫自己分点。遇到实在没思路的问题，就从内部/外部、主观/客观这种万能分类上去讲。\n\t\n3⃣️ 最好准备一些ai相关的项目或能力。大中小厂都在疯狂拥抱ai，苯人之前vibe coding了一个简单的小程序放到了简历上，结果有近半数的面试都问到了这个小程序的设计背景和思路。\n\t\n4⃣️ 不同公司的面试侧重点差异很大，可以做些调研。例如我个人感受腾讯很看性格底色是否与团队匹配，除了通用能力，还会问非常多个人行为向的问题。（你遇到的最大困难/你做过最有成就感的事/你与别人发生争执如何解决…可能需要提前编一下故事。\n\t\n5⃣️ 面试前先过一遍岗位jd和面经，把其中的高频问题记到文档里；也可以把简历和jd喂给ai，让它预测一些高匹配度的问题。\n\t\n6⃣️ 要准备，但不要过度准备。针对预设问题列出框架即可，不需要写逐字稿背答案，抱着“交流思想”的心态而不是“背正确答案”的心态。\n\t\n7⃣️ 提前准备两个反问环节的问题。（例如：部门的主要工作内容以及该岗位具体负责什么/自己有哪些需要补足的点/团队的管理氛围是什么样的…\n\t\n8⃣️ 第一印象太太太重要了，所以面试时有必要强迫自己戴上开朗面具、、打开摄像头就切换成声音洪亮自信微笑状态。\n\t\n9⃣️ 我们有反向考察的权利。如果在面试过程中对方表现出轻蔑、高傲、不尊重，那可以直接放弃这个机会。\n\t\n🔟 接上一条，面试时不开摄像头/对面很嘈杂/明显在做别的事情的面试官，面完迅速挂掉的概率非常大、、、（苯人最近一共遇到过三个这样的，全挂了…\n\t\n1⃣️1⃣️ 影响面试通过与否的因素非常多，甚至跟能力表现关系不大。可能是面完hc没了/碰到更契合的候选人/性格底色不匹配/单纯没眼缘，所以不要因为面试挂掉而自责。\n\t\n1⃣️2⃣️ 面试时录音，面试结束后复盘。列清楚每个问题背后想问什么+要怎么答+不足之处（太笼统/太具体/太啰嗦等等）。\n\t\n1⃣️3⃣️ 不要作弊！！！不要使用辅助面试工具，遇到不会的问题就坦诚说不会，就算挂了还有下次机会，但作弊就再也没机会了。\n\t\n1⃣️4⃣️ 最后，不要让找实习成为这个春天里唯一的事。在投简历面试复盘之外，也要留点时间去感受春天！\n\t\n#实习 #实习生 #面试技巧 #大学生","url":"https://www.xiaohongshu.com/explore/69d4ece80000000022001933","kw":"面试总结"},{"title":"27届秋招记录","author":"answer","date":"07-26 上海","company":"阿里/Qwen","dirs":[],"stages":[],"city":"未注明","fit":false,"desc":"#互联网大厂 #秋招提前批 #校招 #春招 #大模型算法 #面试 #阿里巴巴 #美团 #腾讯 #百度","url":"https://www.xiaohongshu.com/explore/6a65febd000000001303e607","kw":"大模型面经"},{"title":"8.15笔试","author":"paradox","date":"昨天 15:34 北京","company":"阿里/Qwen","dirs":["NLP/通用"],"stages":["笔试"],"city":"未注明","fit":false,"desc":"完全达不到评分线\n#互联网大厂 #算法 #笔试 #阿里 #coding #秋招","url":"https://www.xiaohongshu.com/explore/6a8016980000000033033fe7","kw":"阿里面经"},{"title":"8.15阿里笔试 谁写谁崩溃","author":"AK不倒翁","date":"昨天 16:04 广西","company":"阿里/Qwen","dirs":["NLP/通用"],"stages":["笔试"],"city":"未注明","fit":false,"desc":"秋招第一场阿里，狠狠给了一击，我猜ai coding很多人没能写出来的，唯一好就是选择题分数占比高，ai好弱智啊，搞半天才写了70。\n#秋招提前批 #阿里笔试 #秋招 #留学生求职 #留学生找工作 #互联网大厂实习 #留学生实习 #大厂实习 #校招 #淘天笔试","url":"https://www.xiaohongshu.com/explore/6a801da4000000003400c600","kw":"阿里面经"},{"title":"8.15阿里算法笔试","author":"不要打扰我睡觉！","date":"编辑于 昨天 15:47 浙江","company":"阿里/Qwen","dirs":["NLP/通用"],"stag <script>
var D=JSON.parse(document.getElementById('leesedata').textContent);
var I=D.items, M=D.meta;
document.getElementById('n').textContent=M.total;
document.getElementById('dt').textContent=M.scrape_date;
var dirsSet={},citySet={},coSet={},stSet={};
I.forEach(x=>{x.dirs.forEach(d=>dirsSet[d]=1);x.stages.forEach(s=>stSet[s]=1);citySet[x.city]=1;coSet[x.company]=1});
function fill(sel,obj){Object.keys(obj).sort().forEach(k=>{var o=document.createElement('option');o.value=k;o.textContent=k;sel.appendChild(o)})}
fill(document.getElementById('fd'),dirsSet);
fill(document.getElementById('fc'),coSet);
fill(document.getElementById('fs'),stSet);
fill(document.getElementById('fcity'),citySet);
var stHtml='<span>总计 <b>'+M.total+'</b> 帖</span> <span>★命中方向 <b>'+M.fit+'</b></span>';
Object.keys(M.companies).slice(0,10).forEach(c=>{stHtml+='<span class="pill">'+c+' '+M.companies[c]+'</span>'});
document.getElementById('stat').innerHTML=stHtml;
var fitOnly=false;
var fitBtn=document.getElementById('fitbtn');
fitBtn.onclick=()=>{fitOnly=!fitOnly;fitBtn.classList.toggle('on');render()};
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){
 var q=document.getElementById('q').value.trim().toLowerCase();
 var fd=document.getElementById('fd').value;
 var fc=document.getElementById('fc').value;
 var fs=document.getElementById('fs').value;
 var fcity=document.getElementById('fcity').value;
 var out=[];
 I.forEach(x=>{
   if(fitOnly&&!x.fit)return;
   if(fd&&x.dirs.indexOf(fd)<0)return;
   if(fc&&x.company!=fc)return;
   if(fs&&x.stages.indexOf(fs)<0)return;
   if(fcity&&x.city!=fcity)return;
   if(q){var blob=(x.title+' '+x.company+' '+x.dirs.join(' ')+' '+x.stages.join(' ')+' '+x.desc).toLowerCase();if(blob.indexOf(q)<0)return}
   out.push(x);
 });
 var el=document.getElementById('list');
 if(!out.length){el.innerHTML='<div style="color:var(--mut);text-align:center;padding:40px">无匹配帖</div>';return}
 el.innerHTML=out.map(x=>{
   var tagHtml=x.dirs.map(d=>'<span class="tag '+(d.indexOf('RL')>=0||d=='后训练'?'rl':'')+'">'+d+'</span>').join('')
     +x.stages.map(s=>'<span class="tag stage">'+s+'</span>').join('')
     +'<span class="tag city">'+esc(x.city)+'</span>';
   var star=x.fit?'<span class="star">★</span> ':'';
   var more='';
   if(x.desc.length>180)more=' <span class="more">展开▾</span>';
   return '<div class="card '+(x.fit?'fit':'')+'">'
    +'<div class="cmeta"><span class="co">'+esc(x.company)+'</span>'+tagHtml+'</div>'
    +'<div class="title">'+star+'<a href="'+x.url+'" target="_blank" rel="noopener">'+esc(x.title)+'</a></div>'
    +'<div class="desc">'+esc(x.desc)+'</div>'+more
    +'<div class="apply" style="margin-top:8px;font-size:13px;color:var(--mut)">🙋 '+esc(x.author)+' · '+esc(x.date)+' · 关键词: '+esc(x.kw)+'</div>'
    +'</div>';
 }).join('');
 el.querySelectorAll('.more').forEach((m)=>{
   m.onclick=()=>{var c=m.previousElementSibling;c.classList.toggle('open');m.textContent=c.classList.contains('open')?'收起▴':'展开▾'}
 });
}
document.getElementById('q').oninput=render;
document.getElementById('fd').onchange=render;
document.getElementById('fc').onchange=render;
document.getElementById('fs').onchange=render;
document.getElementById('fcity').onchange=render;
render();
</script>
